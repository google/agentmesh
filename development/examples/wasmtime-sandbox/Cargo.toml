[package]
name = "agentmesh-wasmtime-sandbox"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[dependencies]
base64 = "0.22"
p256 = { version = "0.13", features = ["ecdsa"] }
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
wasmtime = { version = "49.0.4", default-features = false, features = ["cranelift", "runtime", "wat"] }
