# SPIRE server for the OpenShell sandbox example. One trust domain for the
# host; the OIDC discovery provider publishes its JWT signing keys so the Agent
# Mesh control plane can verify sandbox JWT-SVIDs by issuer.
server {
  bind_address = "0.0.0.0"
  bind_port = "8081"
  socket_path = "/tmp/spire-server/private/api.sock"
  trust_domain = "openshell.local"
  data_dir = "/run/spire/data"
  log_level = "INFO"
  # The iss claim of every JWT-SVID. agentmesh-one trusts exactly this issuer
  # (--workload-issuer) and fetches its keys from spire-oidc.
  jwt_issuer = "http://spire-oidc:8008"
  default_jwt_svid_ttl = "5m"
}

plugins {
  DataStore "sql" {
    plugin_data {
      database_type = "sqlite3"
      connection_string = "/run/spire/data/datastore.sqlite3"
    }
  }
  NodeAttestor "join_token" {
    plugin_data {}
  }
  KeyManager "disk" {
    plugin_data {
      keys_path = "/run/spire/data/keys.json"
    }
  }
}
