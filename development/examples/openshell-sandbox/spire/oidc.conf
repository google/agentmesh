# SPIRE OIDC Discovery Provider. Serves /.well-known/openid-configuration and
# /keys for the trust domain over plain HTTP on the Compose network, which is
# all agentmesh-one needs to verify a sandbox JWT-SVID.
log_level = "INFO"
domains = ["spire-oidc"]
allow_insecure_scheme = true
insecure_addr = ":8008"
jwt_issuer = "http://spire-oidc:8008"

server_api {
  address = "unix:///tmp/spire-server/private/api.sock"
}
