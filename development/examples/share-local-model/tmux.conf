# tmux look for the recording: titled panes, a caption pane, no status bar.
set -g default-terminal "tmux-256color"
set -g base-index 0
set -g pane-base-index 0
set -g mouse off
set -g escape-time 0
set -g allow-rename off
set -g allow-set-title off
set -g status off
set -g message-style "bg=#0e7490,fg=#ffffff"

# Pane titles on the top border; the active pane is highlighted.
# The caption pane has an empty title and shows a plain border.
set -g pane-border-status top
set -g pane-border-format "#{?pane_title, #[bold]#{pane_title} ,}"
set -g pane-border-style "fg=#4b5563"
set -g pane-active-border-style "fg=#22d3ee"
