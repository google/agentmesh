# A local MCP server and the client pod run.sh sends requests from.
apiVersion: v1
kind: Namespace
metadata:
  name: apps
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: greeter
  namespace: apps
spec:
  selector:
    matchLabels: { app: greeter }
  template:
    metadata:
      labels: { app: greeter }
    spec:
      containers:
        - name: greeter
          image: agentmesh-kgateway/greeter-mcp:local
          imagePullPolicy: Never
          ports:
            - containerPort: 7778
---
apiVersion: v1
kind: Service
metadata:
  name: greeter
  namespace: apps
spec:
  selector: { app: greeter }
  ports:
    - { name: http, port: 7778 }
---
# ID tokens are fetched into this pod's /tmp and stay there.
apiVersion: v1
kind: Pod
metadata:
  name: client
  namespace: apps
spec:
  containers:
    - name: curl
      image: curlimages/curl:8.11.1
      command: ["sleep", "infinity"]
      volumeMounts:
        - { name: admin, mountPath: /run/example, readOnly: true }
  volumes:
    - name: admin
      secret: { secretName: client-admin }
