config:
  version: v1alpha1
  attenuation:
    policies: []
  services:
    - type: mcp
      name: pool-manager
      description: Leases free workers from the code-reviewer pool (acquire/release)
      target_url: http://127.0.0.1:7780/mcp
service:
  name: pool-manager
  image: pool-manager:local
  # The manager calls its node's API with the token the chart generates.
  env:
    - name: AGENTMESH_API_TOKEN
      valueFrom:
        secretKeyRef:
          name: manager-agentmesh-node-api-token
          key: api-token
