suite: control plane deployment
templates:
  # secrets.yaml must be loaded for the checksum/secrets include to resolve
  - templates/control-plane-deployment.yaml
  - templates/secrets.yaml
release:
  name: sam-mesh
tests:
  - it: pins the numeric distroless uid so runAsNonRoot is verifiable
    template: templates/control-plane-deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.securityContext.runAsNonRoot
          value: true
      - equal:
          path: spec.template.spec.securityContext.runAsUser
          value: 65532

  - it: rolls the pods when the shared secret changes
    template: templates/control-plane-deployment.yaml
    set:
      controlPlane.adminToken: aaa
      database.postgres.password: p
    asserts:
      - matchRegex:
          path: spec.template.metadata.annotations["checksum/secrets"]
          pattern: ^[0-9a-f]{64}$

  - it: hostPort disables surge so rollouts can rebind the node port
    template: templates/control-plane-deployment.yaml
    set:
      controlPlane.hostPort: 8080
    asserts:
      - equal:
          path: spec.strategy.rollingUpdate.maxSurge
          value: 0
      - equal:
          path: spec.strategy.rollingUpdate.maxUnavailable
          value: 1

  - it: no strategy override without hostPort
    template: templates/control-plane-deployment.yaml
    asserts:
      - notExists:
          path: spec.strategy

  - it: uses the default image tag when none is pinned
    template: templates/control-plane-deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: sam-control-plane:local

  - it: external postgres points the DSN at the configured host
    template: templates/control-plane-deployment.yaml
    set:
      database.postgres.deployInternal: false
      database.postgres.host: ext-db
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].args[2]
          pattern: "@ext-db:5432"

  - it: scheduling knobs pass through to the pod spec
    template: templates/control-plane-deployment.yaml
    set:
      controlPlane.nodeSelector.disk: ssd
      controlPlane.tolerations:
        - key: dedicated
    asserts:
      - equal:
          path: spec.template.spec.nodeSelector.disk
          value: ssd
      - contains:
          path: spec.template.spec.tolerations
          content:
            key: dedicated

  - it: passes workload issuer and session ttl flags when configured
    template: templates/control-plane-deployment.yaml
    set:
      controlPlane.workloadIssuer: "https://kubernetes.default.svc.cluster.local"
      controlPlane.workloadSessionTtl: "48h"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--workload-issuer=https://kubernetes.default.svc.cluster.local"
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--workload-session-ttl=48h"

