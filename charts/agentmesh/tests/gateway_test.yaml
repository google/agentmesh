suite: gateway
templates:
  - templates/gateway.yaml
release:
  name: agentmesh
tests:
  - it: disabled by default renders nothing
    asserts:
      - hasDocuments:
          count: 0

  - it: enabling it requires gateway.className
    set:
      gateway.enabled: true
    asserts:
      - failedTemplate:
          errorPattern: gateway.className is required when gateway.enabled is true

  - it: routes enrollment, console redirect/rewrite, and router /ingress by default
    set:
      gateway.enabled: true
      gateway.className: x
    documentSelector:
      path: kind
      value: HTTPRoute
    asserts:
      # enrollment surface + consolePath 302 + consolePath URLRewrite + /ingress -> router
      - lengthEqual:
          path: spec.rules
          count: 4
      # Every path a node calls on its own must be on the allow-list, or the
      # node's periodic push silently 404s at the gateway.
      - contains:
          path: spec.rules[0].matches
          content:
            path:
              type: Exact
              value: /refresh
      - contains:
          path: spec.rules[0].matches
          content:
            path:
              type: Exact
              value: /nodes/catalog
      - contains:
          path: spec.rules[0].matches
          content:
            path:
              type: Exact
              value: /egress
      - contains:
          path: spec.rules[0].matches
          content:
            path:
              type: Exact
              value: /revocations
      - contains:
          path: spec.rules[0].matches
          content:
            path:
              type: Exact
              value: /token/exchange
      - contains:
          path: spec.rules[0].matches
          content:
            path:
              type: Exact
              value: /sts/token
      - contains:
          path: spec.rules[3].matches
          content:
            path:
              type: PathPrefix
              value: /ingress/
      - equal:
          path: spec.rules[3].backendRefs[0].name
          value: agentmesh-router
      - equal:
          path: spec.rules[3].backendRefs[0].port
          value: 8090

  - it: empty consolePath leaves the console unrouted
    set:
      gateway.enabled: true
      gateway.className: x
      gateway.consolePath: ""
    documentSelector:
      path: kind
      value: HTTPRoute
    asserts:
      - lengthEqual:
          path: spec.rules
          count: 2

  - it: ingressRoute false omits the /ingress router rule
    set:
      gateway.enabled: true
      gateway.className: x
      gateway.ingressRoute: false
    documentSelector:
      path: kind
      value: HTTPRoute
    asserts:
      - lengthEqual:
          path: spec.rules
          count: 3

  - it: adminRoute adds the /admin rule
    set:
      gateway.enabled: true
      gateway.className: x
      gateway.adminRoute: true
    documentSelector:
      path: kind
      value: HTTPRoute
    asserts:
      - lengthEqual:
          path: spec.rules
          count: 5
      - contains:
          path: spec.rules[1].matches
          content:
            path:
              type: PathPrefix
              value: /admin
