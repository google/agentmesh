suite: router statefulset
templates:
  - templates/router-statefulset.yaml
release:
  # collapses fullname to "agentmesh" (see _helpers.tpl)
  name: agentmesh
tests:
  - it: pins the numeric distroless uid so runAsNonRoot is verifiable
    documentSelector:
      path: kind
      value: StatefulSet
    asserts:
      - equal:
          path: spec.template.spec.securityContext.runAsNonRoot
          value: true
      - equal:
          path: spec.template.spec.securityContext.runAsUser
          value: 65532
      - equal:
          path: spec.template.spec.initContainers[0].securityContext.runAsUser
          value: 100

  - it: announces the service DNS address when hostPort is unset
    documentSelector:
      path: kind
      value: StatefulSet
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --external-addr=/dns4/agentmesh-router/tcp/4501
      - contains:
          path: spec.template.spec.containers[0].args
          content: --insecure-control-plane
      - notExists:
          path: spec.template.spec.containers[0].ports[0].hostPort

  - it: announced DNS address follows router.service.port
    set:
      router.service.port: 9999
    documentSelector:
      path: kind
      value: StatefulSet
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --external-addr=/dns4/agentmesh-router/tcp/9999

  - it: hostPort binds both protocols and announces the node IP
    set:
      router.hostPort: 4501
    documentSelector:
      path: kind
      value: StatefulSet
    asserts:
      - equal:
          path: spec.template.spec.containers[0].ports[0].hostPort
          value: 4501
      - equal:
          path: spec.template.spec.containers[0].ports[1].hostPort
          value: 4501
      - contains:
          path: spec.template.spec.containers[0].args
          content: --external-addr=/ip4/$(HOST_IP)/tcp/4501
      - contains:
          path: spec.template.spec.containers[0].args
          content: --external-addr=/ip4/$(HOST_IP)/udp/4501/quic-v1

  - it: externalAddrs overrides the derived announcement
    set:
      router.hostPort: 4501
      router.externalAddrs:
        - /dns4/x/tcp/1
    documentSelector:
      path: kind
      value: StatefulSet
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --external-addr=/dns4/x/tcp/1
      - notContains:
          path: spec.template.spec.containers[0].args
          content: --external-addr=/ip4/$(HOST_IP)/tcp/4501

  - it: keeps the key on a PVC, not emptyDir
    documentSelector:
      path: kind
      value: StatefulSet
    asserts:
      - equal:
          path: spec.volumeClaimTemplates[0].metadata.name
          value: router-data
      - equal:
          path: spec.volumeClaimTemplates[0].spec.resources.requests.storage
          value: 1Gi
      - notExists:
          path: spec.volumeClaimTemplates[0].spec.storageClassName
      - notContains:
          path: spec.template.spec.volumes
          content:
            name: router-data
          any: true

  - it: storageClass sets the PVC storageClassName
    set:
      router.storageClass: fast-ssd
    documentSelector:
      path: kind
      value: StatefulSet
    asserts:
      - equal:
          path: spec.volumeClaimTemplates[0].spec.storageClassName
          value: fast-ssd

  - it: useOidcToken swaps the bootstrap token for a projected JWT
    set:
      router.useOidcToken: true
    documentSelector:
      path: kind
      value: StatefulSet
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --jwt-path=/var/run/secrets/tokens/agentmesh-token
      - notContains:
          path: spec.template.spec.containers[0].args
          content: --bootstrap-token-path=/var/run/secrets/agentmesh-router/token
      - exists:
          path: spec.template.spec.volumes[0].projected

  - it: bootstrap token is mounted as a file, never passed in argv or env
    documentSelector:
      path: kind
      value: StatefulSet
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --bootstrap-token-path=/var/run/secrets/agentmesh-router/token
      - notContains:
          path: spec.template.spec.containers[0].args
          content: --bootstrap-token=$(BOOTSTRAP_TOKEN)
      - notExists:
          path: spec.template.spec.containers[0].env
      - equal:
          path: spec.template.spec.volumes[0].secret.secretName
          value: agentmesh-router-token

  - it: image.tag overrides global.imageTag for the router only
    set:
      router.image.tag: v9
    documentSelector:
      path: kind
      value: StatefulSet
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: agentmesh-router:v9

  - it: serves metrics on a containerPort that probes use and no hostPort reaches
    set:
      router.hostPort: 4501
    documentSelector:
      path: kind
      value: StatefulSet
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --metrics-addr=0.0.0.0:9090
      - equal:
          path: spec.template.spec.containers[0].ports[2].name
          value: metrics
      - equal:
          path: spec.template.spec.containers[0].ports[2].containerPort
          value: 9090
      - notExists:
          path: spec.template.spec.containers[0].ports[2].hostPort
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.path
          value: /readyz
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.port
          value: metrics
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.path
          value: /healthz
      - equal:
          path: spec.template.spec.containers[0].startupProbe.httpGet.path
          value: /healthz

  - it: metricsPort moves the listener, the port and the probes together
    set:
      router.metricsPort: 9999
    documentSelector:
      path: kind
      value: StatefulSet
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --metrics-addr=0.0.0.0:9999
      - equal:
          path: spec.template.spec.containers[0].ports[2].containerPort
          value: 9999

  - it: binds external HTTP ingress on ingressPort and forwards ingressUrl when configured
    set:
      router.ingressPort: 8095
      router.ingressUrl: https://mesh.example.com/ingress
      router.publicControlPlaneUrl: https://mesh.example.com
    documentSelector:
      path: kind
      value: StatefulSet
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --ingress-addr=0.0.0.0:8095
      - contains:
          path: spec.template.spec.containers[0].args
          content: --allow-insecure-ingress-http
      - contains:
          path: spec.template.spec.containers[0].args
          content: --ingress-url=https://mesh.example.com/ingress
      - contains:
          path: spec.template.spec.containers[0].args
          content: --public-control-plane=https://mesh.example.com
      - equal:
          path: spec.template.spec.containers[0].ports[3].name
          value: ingress-http
      - equal:
          path: spec.template.spec.containers[0].ports[3].containerPort
          value: 8095
