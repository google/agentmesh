apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "agentmesh.fullname" . }}-bootstrap-sa
  labels:
    {{- include "agentmesh.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "agentmesh.fullname" . }}-bootstrap-role
  labels:
    {{- include "agentmesh.labels" . | nindent 4 }}
rules:
# resourceNames cannot restrict create (the name is unknown at admission),
# so it gets a bare rule; everything else is pinned to the router-token secret.
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["create"]
- apiGroups: [""]
  resources: ["secrets"]
  resourceNames: ["{{ include "agentmesh.fullname" . }}-router-token"]
  verbs: ["get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "agentmesh.fullname" . }}-bootstrap-rb
  labels:
    {{- include "agentmesh.labels" . | nindent 4 }}
subjects:
- kind: ServiceAccount
  name: {{ include "agentmesh.fullname" . }}-bootstrap-sa
  namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ include "agentmesh.fullname" . }}-bootstrap-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "agentmesh.fullname" . }}-bootstrap
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation
  labels:
    {{- include "agentmesh.labels" . | nindent 4 }}
spec:
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app: {{ include "agentmesh.fullname" . }}-bootstrap
    spec:
      serviceAccountName: {{ include "agentmesh.fullname" . }}-bootstrap-sa
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        # curlimages/curl's USER is non-numeric; runAsNonRoot needs an explicit uid.
        runAsUser: 100
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: bootstrap
        image: curlimages/curl:8.6.0
        imagePullPolicy: {{ .Values.global.imagePullPolicy }}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 100m
            memory: 64Mi
        env:
        - name: NAMESPACE
          value: {{ .Release.Namespace | quote }}
        - name: SECRET_NAME
          value: "{{ include "agentmesh.fullname" . }}-router-token"
        - name: ADMIN_TOKEN
          valueFrom:
            secretKeyRef:
              name: {{ include "agentmesh.fullname" . }}-secrets
              key: admin-token
        command: ["/bin/sh", "-c"]
        args:
        - |
          set -e
          CACERT=/var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          K8S_TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
          CP_URL="http://{{ include "agentmesh.fullname" . }}-control-plane:{{ .Values.controlPlane.service.port }}"

          echo "Waiting for Control Plane to be ready..."
          until curl -sf "${CP_URL}/info" > /dev/null; do
            echo "Control plane not ready yet, sleeping..."
            sleep 2
          done

          # Seed only a mesh with no policy: after that the database is the source
          # of truth, and an upgrade must not overwrite edits made in the console.
          POLICY=$(curl -sf -H "Authorization: Bearer ${ADMIN_TOKEN}" "${CP_URL}/admin/policy")
          if echo "${POLICY}" | grep -q '"roles"[[:space:]]*:'; then
            echo "Mesh policy already present; not seeding it (edit it in the console or with POST /policies)."
          else
            echo "Seeding default policies..."
            {{- $bindings := .Values.bootstrap.bindings -}}
            {{- if not $bindings -}}
              {{- $defaultRouterSA := printf "user:system:serviceaccount:%s:%s-router-sa" .Release.Namespace (include "agentmesh.fullname" .) -}}
              {{- $bindings = list (dict "role" "mesh:role:router" "members" (list "group:routers" $defaultRouterSA)) -}}
              {{- if .Values.bootstrap.nodeMembers -}}
                {{- $bindings = append $bindings (dict "role" "mesh:role:node" "members" .Values.bootstrap.nodeMembers) -}}
              {{- end -}}
            {{- end }}
            curl -sf -X POST \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer ${ADMIN_TOKEN}" \
              -d '{
                "roles": [
                  {"name": "mesh-admin", "allowed_services": ["*"], "allowed_targets": ["*"]},
                  {"name": "mesh:role:router", "allowed_services": ["*"], "allowed_targets": ["*"]},
                  {"name": "mesh:role:node", "allowed_services": {{ toJson .Values.bootstrap.nodeServices }}, "allowed_publish": {{ toJson .Values.bootstrap.nodePublish }}, "allowed_targets": ["*"], "allowed_labels": {{ toJson .Values.bootstrap.nodeLabels }}}
                ],
                "bindings": {{ toJson $bindings }}
              }' \
              "${CP_URL}/policies" >/dev/null
          fi


          echo "Generating bootstrap token for agentmesh-router..."
          # One use per router replica: a leaked token is worth nothing once
          # the routers have enrolled.
          TOKEN_RESP=$(curl -sf -X POST \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${ADMIN_TOKEN}" \
            -d '{"role": "mesh:role:router", "max_usages": {{ .Values.router.replicaCount | int }}}' \
            "${CP_URL}/admin/bootstrap-tokens")

          ROUTER_TOKEN=$(echo "${TOKEN_RESP}" | sed -n 's/.*"token"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p')
          if [ -z "${ROUTER_TOKEN}" ]; then
            echo "Failed to extract router token from response: ${TOKEN_RESP}"
            exit 1
          fi

          echo "Writing bootstrap token to Kubernetes secret ${SECRET_NAME}..."
          curl -sf --cacert $CACERT -X PATCH \
            -H "Authorization: Bearer $K8S_TOKEN" \
            -H "Content-Type: application/apply-patch+yaml" \
            -d '{
              "apiVersion": "v1",
              "kind": "Secret",
              "metadata": {
                "name": "'"${SECRET_NAME}"'"
              },
              "type": "Opaque",
              "stringData": {
                "token": "'"${ROUTER_TOKEN}"'"
              }
            }' \
            "https://kubernetes.default.svc/api/v1/namespaces/${NAMESPACE}/secrets/${SECRET_NAME}?fieldManager=agentmesh-bootstrap&force=true" > /dev/null

          echo "Bootstrap completed successfully!"
