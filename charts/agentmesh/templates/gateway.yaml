{{- if .Values.gateway.enabled -}}
{{- $fullName := include "agentmesh.fullname" . -}}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ $fullName }}-gateway
  labels:
    {{- include "agentmesh.labels" . | nindent 4 }}
  {{- with .Values.gateway.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  gatewayClassName: {{ required "gateway.className is required when gateway.enabled is true" .Values.gateway.className }}
  {{- with .Values.gateway.addresses }}
  addresses:
    {{- toYaml . | nindent 2 }}
  {{- end }}
  listeners:
    {{- toYaml .Values.gateway.listeners | nindent 2 }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $fullName }}-route
  labels:
    {{- include "agentmesh.labels" . | nindent 4 }}
spec:
  parentRefs:
  - name: {{ $fullName }}-gateway
  {{- with .Values.gateway.hostnames }}
  hostnames:
    {{- toYaml . | nindent 2 }}
  {{- end }}
  rules:
  # The enrollment and mesh runtime surface, matching the cloud's allow-list exactly.
  - matches:
    - path:
        type: Exact
        value: /register
    - path:
        type: Exact
        value: /info
    - path:
        type: Exact
        value: /keys
    - path:
        type: Exact
        value: /routers/lease
    - path:
        type: Exact
        value: /policies
    - path:
        type: Exact
        value: /egress
    - path:
        type: Exact
        value: /revocations
    - path:
        type: Exact
        value: /token/exchange
    - path:
        type: Exact
        value: /sts/token
    - path:
        type: Exact
        value: /enroll
    - path:
        type: Exact
        value: /enroll/status
    - path:
        type: Exact
        value: /refresh
    - path:
        type: Exact
        value: /nodes/catalog
    - path:
        type: Exact
        value: /.well-known/openid-configuration
    - path:
        type: Exact
        value: /.well-known/oauth-authorization-server
    - path:
        type: Exact
        value: /jwks
    - path:
        type: Exact
        value: /oauth/authorize
    - path:
        type: Exact
        value: /oauth/token
    backendRefs:
    - name: {{ $fullName }}-control-plane
      port: {{ .Values.controlPlane.service.port }}
  {{- if .Values.gateway.adminRoute }}
  - matches:
    - path:
        type: PathPrefix
        value: /admin
    backendRefs:
    - name: {{ $fullName }}-control-plane
      port: {{ .Values.controlPlane.service.port }}
  {{- end }}
  {{- if and .Values.console.enabled .Values.gateway.consolePath }}
  # The cloud deployment's console shape: the bare prefix 302s to <prefix>/, and
  # URLRewrite (Extended conformance) strips it before the console sees the request.
  - matches:
    - path:
        type: Exact
        value: {{ .Values.gateway.consolePath }}
    filters:
    - type: RequestRedirect
      requestRedirect:
        path:
          type: ReplaceFullPath
          replaceFullPath: {{ .Values.gateway.consolePath }}/
        statusCode: 302
  - matches:
    - path:
        type: PathPrefix
        value: {{ .Values.gateway.consolePath }}/
    filters:
    - type: URLRewrite
      urlRewrite:
        path:
          type: ReplacePrefixMatch
          replacePrefixMatch: /
    backendRefs:
    - name: {{ $fullName }}-console
      port: {{ .Values.console.service.port }}
  {{- end }}
  {{- if and .Values.gateway.ingressRoute .Values.router.enabled .Values.router.ingressPort }}
  - matches:
    - path:
        type: Exact
        value: /ingress
    - path:
        type: PathPrefix
        value: /ingress/
    backendRefs:
    - name: {{ $fullName }}-router
      port: {{ .Values.router.ingressPort }}
  {{- end }}
{{- end }}
