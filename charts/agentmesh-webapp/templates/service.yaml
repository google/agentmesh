apiVersion: v1
kind: Service
metadata:
  name: {{ include "agentmesh-webapp.fullname" . }}
  labels:
    {{- include "agentmesh-webapp.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
  - name: http
    port: {{ .Values.service.port }}
    targetPort: http
    {{- if and (eq .Values.service.type "NodePort") .Values.service.nodePort }}
    nodePort: {{ .Values.service.nodePort }}
    {{- end }}
    protocol: TCP
  selector:
    {{- include "agentmesh-webapp.selectorLabels" . | nindent 4 }}
