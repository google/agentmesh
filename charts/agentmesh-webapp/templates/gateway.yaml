{{- if .Values.gateway.enabled -}}
{{- $fullName := include "agentmesh-webapp.fullname" . -}}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ $fullName }}-gateway
  labels:
    {{- include "agentmesh-webapp.labels" . | nindent 4 }}
  {{- with .Values.gateway.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  gatewayClassName: {{ required "gateway.className is required when gateway.enabled is true" .Values.gateway.className }}
  {{- with .Values.gateway.addresses }}
  addresses:
    {{- toYaml . | nindent 2 }}
  {{- end }}
  listeners:
    {{- toYaml .Values.gateway.listeners | nindent 2 }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $fullName }}-route
  labels:
    {{- include "agentmesh-webapp.labels" . | nindent 4 }}
spec:
  parentRefs:
  - name: {{ $fullName }}-gateway
  {{- with .Values.gateway.hostnames }}
  hostnames:
    {{- toYaml . | nindent 2 }}
  {{- end }}
  rules:
  {{- with .Values.gateway.path }}
  # The bare prefix 302s to <prefix>/, and URLRewrite (Extended conformance)
  # strips it, because the web app serves at /.
  - matches:
    - path:
        type: Exact
        value: {{ . }}
    filters:
    - type: RequestRedirect
      requestRedirect:
        path:
          type: ReplaceFullPath
          replaceFullPath: {{ . }}/
        statusCode: 302
  - matches:
    - path:
        type: PathPrefix
        value: {{ . }}/
    filters:
    - type: URLRewrite
      urlRewrite:
        path:
          type: ReplacePrefixMatch
          replacePrefixMatch: /
    backendRefs:
    - name: {{ $fullName }}
      port: {{ $.Values.service.port }}
  {{- else }}
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: {{ $fullName }}
      port: {{ .Values.service.port }}
  {{- end }}
{{- end }}
