version: 2
project_name: agentmesh
# Deliberately not released: agentmesh-bench (a measurement instrument for people
# working on the mesh, built from the repo, not something operators install)
# and chaos-agent (a Python dev tool).
builds:
  - id: agentmesh-node
    main: ./cmd/agentmesh-node
    binary: agentmesh-node
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/google/agentmesh/internal/version.Version={{ .Tag }}
  - id: agentmesh-control-plane
    main: ./cmd/agentmesh-control-plane
    binary: agentmesh-control-plane
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/google/agentmesh/internal/version.Version={{ .Tag }}
  - id: agentmesh-router
    main: ./cmd/agentmesh-router
    binary: agentmesh-router
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/google/agentmesh/internal/version.Version={{ .Tag }}
  - id: mcp-client
    main: ./cmd/mcp-client
    binary: mcp-client
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/google/agentmesh/internal/version.Version={{ .Tag }}
  - id: agentmesh-console
    main: ./cmd/agentmesh-console
    binary: agentmesh-console
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/google/agentmesh/internal/version.Version={{ .Tag }}
  - id: agentmesh-one
    main: ./cmd/agentmesh-one
    binary: agentmesh-one
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/google/agentmesh/internal/version.Version={{ .Tag }}
archives:
  - formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    format_overrides:
      - goos: windows
        formats:
          - zip
checksum:
  # install.sh downloads releases/download/<tag>/checksums.txt; keep the name
  # fixed so it does not follow project_name and the version.
  name_template: checksums.txt
