[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "agentmesh-p2p"
version = "0.1.0"
description = "Native SDK for joining an Agent Mesh from inside a Python agent process"
readme = "README.md"
license = "Apache-2.0"
# <3.14: py-libp2p pins coincurve 21.0.0, which has no 3.14 wheels
# (libp2p/py-libp2p#1140). Lift this when that is fixed.
requires-python = ">=3.11,<3.14"
dependencies = [
    "anyio>=4",
    "biscuit-python>=0.4",
    "cryptography>=42",
    # HTTP/1.1 on a libp2p stream (/libp2p-http) and forwarding to a backend.
    "h11>=0.14",
    "httpx>=0.27",
    "libp2p>=0.8,<0.9",
    "mcp>=2,<3",
    "multiaddr>=0.2",
    # py-libp2p requires protobuf<7; stay co-installable.
    "protobuf>=4.25,<8",
    "trio>=0.26",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
]
# What examples/a2a_agent.py and examples/a2a_call.py need: the official A2A
# SDK and a server to run its app on. Not a dependency of the package.
examples = [
    "a2a-sdk[http-server]>=1.1",
    "uvicorn>=0.30",
]

[project.urls]
Homepage = "https://github.com/google/agentmesh"
Source = "https://github.com/google/agentmesh/tree/main/sdk/python"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_mesh"]

[tool.pytest.ini_options]
testpaths = ["tests"]
