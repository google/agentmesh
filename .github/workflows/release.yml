name: goreleaser

on:
  push:
    # run only against release tags
    tags:
      - "v*"
  # Publish the SDKs of a tag whose release already exists (a failed
  # publish-sdk-* run). goreleaser does not run again.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag, e.g. v0.1.0-rc.4"
        required: true
        type: string
      sdk:
        description: "SDK to publish"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - js
          - python

permissions:
  contents: read

jobs:
  goreleaser:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: stable
          cache: false
      - name: Run GoReleaser
        # The mobile app is built and attached to this release by the
        # parallel "Mobile App" workflow (.github/workflows/mobile.yml).
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-sdk-js:
    runs-on: ubuntu-latest
    needs: goreleaser
    if: always() && (github.event_name == 'workflow_dispatch' || needs.goreleaser.result == 'success') && (github.event_name != 'workflow_dispatch' || inputs.sdk == 'all' || inputs.sdk == 'js' || inputs.sdk == '')
    permissions:
      contents: read
      id-token: write
    env:
      SDK_VERSION: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: npm
          cache-dependency-path: sdk/js/package-lock.json
      - name: Stamp the release version on both SDKs
        run: ./hack/sdk-version.sh "${SDK_VERSION#v}"
      - name: Build and publish @agentmesh-p2p/sdk
        # npm's trusted publishing needs npm 11.5 or later; Node 22 ships 10.
        # npm 11 refuses to publish a prerelease without an explicit dist-tag,
        # and "latest" must stay on stable versions.
        # If this version is already published, skip so the job can be safely retried.
        working-directory: sdk/js
        run: |
          ver="${SDK_VERSION#v}"
          if npm view "@agentmesh-p2p/sdk@${ver}" version >/dev/null 2>&1; then
            echo "@agentmesh-p2p/sdk@${ver} is already published on npm; skipping."
            exit 0
          fi
          npm install -g npm@latest
          npm ci
          npm run build
          case "$ver" in
            *-*) tag=next ;;
            *)   tag=latest ;;
          esac
          npm publish --provenance --access public --tag "$tag"
      - name: Install mcp-publisher
        run: |
          curl -fsSL -o "$RUNNER_TEMP/mcp-publisher.tar.gz" \
            https://github.com/modelcontextprotocol/registry/releases/download/v1.8.7/mcp-publisher_linux_amd64.tar.gz
          echo "00b21004149a4ce66f0782508ae4a2bce67d1bea395a8da0bd8028159fb59579  $RUNNER_TEMP/mcp-publisher.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/mcp-publisher.tar.gz" -C "$RUNNER_TEMP" mcp-publisher
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Publish io.github.google/agentmesh to the MCP registry
        # The registry checks mcpName in the npm package, so this runs after npm publish.
        # If this version is already listed, skip so the job can be safely retried.
        # GitHub OIDC (id-token: write above) grants the io.github.google/* namespace.
        working-directory: sdk/js
        run: |
          ver="${SDK_VERSION#v}"
          if curl -fsS "https://registry.modelcontextprotocol.io/v0.1/servers/io.github.google%2Fagentmesh/versions/${ver}" >/dev/null 2>&1; then
            echo "io.github.google/agentmesh ${ver} is already listed in the MCP registry; skipping."
            exit 0
          fi
          mcp-publisher login github-oidc
          mcp-publisher publish

  publish-sdk-python:
    runs-on: ubuntu-latest
    needs: goreleaser
    if: always() && (github.event_name == 'workflow_dispatch' || needs.goreleaser.result == 'success') && (github.event_name != 'workflow_dispatch' || inputs.sdk == 'all' || inputs.sdk == 'python' || inputs.sdk == '')
    permissions:
      contents: read
      id-token: write
    env:
      SDK_VERSION: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Stamp the release version on both SDKs
        run: ./hack/sdk-version.sh "${SDK_VERSION#v}"
      - name: Build agentmesh-p2p
        working-directory: sdk/python
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: 'projects/305452601764/locations/global/workloadIdentityPools/builders/providers/github'
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
      - name: Stage distributions and trigger OSS Exit Gate release
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          python3 -m venv .exit-gate-venv
          .exit-gate-venv/bin/python -m pip install --upgrade pip twine keyrings.google-artifactregistry-auth
          .exit-gate-venv/bin/python -m twine upload \
            --repository-url https://us-python.pkg.dev/oss-exit-gate-prod/agentmesh--pypi/ \
            --non-interactive \
            --skip-existing \
            sdk/python/dist/*
          cat <<EOF > manifest.json
          {
            "publish_all": true
          }
          EOF
          gcloud storage cp manifest.json \
            "gs://oss-exit-gate-prod-projects-bucket/agentmesh/pypi/manifests/manifest-${RUN_ID}-${RUN_ATTEMPT}.json"
