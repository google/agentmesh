name: goreleaser

on:
  push:
    # run only against release tags
    tags:
      - "v*"
  # Publish the SDKs of a tag whose release already exists (a failed
  # publish-sdk-* run). goreleaser does not run again.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag, e.g. v0.1.0-rc.4"
        required: true
        type: string
      sdk:
        description: "SDK to publish"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - js
          - python

permissions:
  contents: read

jobs:
  goreleaser:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: stable
          cache: false
      - name: Run GoReleaser
        # The mobile app is built and attached to this release by the
        # parallel "Mobile App" workflow (.github/workflows/mobile.yml).
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-sdk-js:
    runs-on: ubuntu-latest
    needs: goreleaser
    if: always() && (github.event_name == 'workflow_dispatch' || needs.goreleaser.result == 'success') && (github.event_name != 'workflow_dispatch' || inputs.sdk == 'all' || inputs.sdk == 'js' || inputs.sdk == '')
    permissions:
      contents: read
      id-token: write
    env:
      SDK_VERSION: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: npm
          cache-dependency-path: sdk/js/package-lock.json
      - name: Stamp the release version on both SDKs
        run: ./hack/sdk-version.sh "${SDK_VERSION#v}"
      - name: Build and publish @agentmesh-p2p/sdk
        # npm's trusted publishing needs npm 11.5 or later; Node 22 ships 10.
        # npm 11 refuses to publish a prerelease without an explicit dist-tag,
        # and "latest" must stay on stable versions.
        # If this version is already published, skip so the job can be safely retried.
        working-directory: sdk/js
        run: |
          ver="${SDK_VERSION#v}"
          if npm view "@agentmesh-p2p/sdk@${ver}" version >/dev/null 2>&1; then
            echo "@agentmesh-p2p/sdk@${ver} is already published on npm; skipping."
            exit 0
          fi
          npm install -g npm@latest
          npm ci
          npm run build
          case "$ver" in
            *-*) tag=next ;;
            *)   tag=latest ;;
          esac
          npm publish --provenance --access public --tag "$tag"

  publish-sdk-python:
    runs-on: ubuntu-latest
    needs: goreleaser
    if: always() && (github.event_name == 'workflow_dispatch' || needs.goreleaser.result == 'success') && (github.event_name != 'workflow_dispatch' || inputs.sdk == 'all' || inputs.sdk == 'python' || inputs.sdk == '')
    permissions:
      contents: read
      id-token: write
    env:
      SDK_VERSION: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Stamp the release version on both SDKs
        run: ./hack/sdk-version.sh "${SDK_VERSION#v}"
      - name: Build agentmesh-p2p
        working-directory: sdk/python
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Publish agentmesh-p2p
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: sdk/python/dist/
          skip-existing: true
