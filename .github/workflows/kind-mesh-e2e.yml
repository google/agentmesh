name: kind-mesh-e2e

on:
  push:
    branches:
      - "main"
    tags:
      - "v*"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  GO_VERSION: "1.26"

jobs:
  kind_mesh_e2e:
    runs-on: ubuntu-22.04
    name: Kind mesh e2e
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Install kind and kubectl
        run: |
          sudo sysctl fs.inotify.max_user_watches=524288 || true
          sudo sysctl fs.inotify.max_user_instances=512 || true
          go install sigs.k8s.io/kind@v0.33.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          curl -sSLo /tmp/kubectl "https://dl.k8s.io/release/v1.37.0/bin/linux/amd64/kubectl"
          sudo install -m 0755 /tmp/kubectl /usr/local/bin/kubectl
          kind version
          kubectl version --client

      - name: Build binaries
        run: make build

      - name: Bring up the kind mesh
        run: make kind-up ARGS="-s"

      - name: Run e2e mesh tests
        run: make kind-e2e-mesh

      - name: Collect logs on failure
        if: failure()
        run: |
          mkdir -p _artifacts
          kind export logs --name agentmesh-kind ./_artifacts/logs
          cp "$RUNNER_TEMP/local-node.log" _artifacts/ 2>/dev/null || true

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kind-mesh-e2e-logs-${{ github.run_id }}
          path: ./_artifacts

      - name: Tear down the cluster
        if: always()
        run: make kind-down
