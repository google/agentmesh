name: Test Flutter App

on:
  push:
    branches:
      - 'main'
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]

permissions:
  contents: read

# A superseded push to the same PR obsoletes the running check.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GO_VERSION: "1.26"

jobs:
  build-ffi:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
      with:
        go-version: ${{ env.GO_VERSION }}
    - run: make mobile-ffi-host

  analyze-flutter:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
      with:
        channel: 'stable'
        cache: true
    - name: Install dependencies
      run: flutter pub get
      working-directory: mobile/sam-node-app
    - name: Analyze code
      run: flutter analyze
      working-directory: mobile/sam-node-app

  e2e-android:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
      with:
        go-version: ${{ env.GO_VERSION }}
    - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
      with:
        channel: 'stable'
        cache: true
    - name: Set up JDK
      uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'gradle'
    - name: Enable KVM group perms
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
    - name: Inject Google Services Configuration
      env:
        GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
      run: |
        if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
          echo "[CI] Decoding google-services.json from secret..."
          echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > mobile/sam-node-app/android/app/google-services.json
        else
          echo "[CI] GOOGLE_SERVICES_JSON_BASE64 secret not set, copying dummy configuration template..."
          cp mobile/sam-node-app/android/app/google-services.json.tmpl mobile/sam-node-app/android/app/google-services.json
        fi
    - name: Build images and start the mesh (no emulator needed)
      run: ./mobile/mobile_e2e.sh setup
    - name: AVD cache
      id: avd-cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.android/avd/*
          ~/.android/adb*
        key: avd-30-google_apis-x86_64
    - name: Create AVD snapshot for caching
      if: steps.avd-cache.outputs.cache-hit != 'true'
      uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
      with:
        api-level: 30
        target: google_apis
        arch: x86_64
        avd-name: test
        force-avd-creation: false
        disable-animations: false
        emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
        emulator-boot-timeout: 300
        script: echo "Generated AVD snapshot for caching."
    # The action above only creates the AVD. Restoring its snapshot resumes a
    # guest whose sys.boot_completed is already 1, so the action's boot wait
    # returns as soon as adb reconnects and its unconditional `input keyevent
    # 82` races the system services coming back ("No service published for:
    # input"), failing one run in six before the test starts. Booting here lets
    # the readiness check wait for the thing that actually failed.
    - name: Boot the emulator from the cached snapshot
      run: |
        set -o errexit -o nounset -o pipefail
        export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"
        echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
        echo "ANDROID_AVD_HOME=$HOME/.android/avd" >> "$GITHUB_ENV"
        export ANDROID_AVD_HOME="$HOME/.android/avd"
        yes | sdkmanager --licenses >/dev/null
        sdkmanager --install platform-tools emulator 'system-images;android-30;google_apis;x86_64' >/dev/null
        nohup emulator -avd test -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none >emulator.log 2>&1 &
        timeout 300 adb wait-for-device
        ready=0
        for _ in $(seq 1 150); do
          if [[ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" == "1" ]] && adb shell input keyevent 82 2>/dev/null; then
            ready=1; break
          fi
          sleep 2
        done
        if [[ "$ready" != 1 ]]; then echo "emulator did not become ready"; tail -n 50 emulator.log; exit 1; fi
        adb shell settings put global window_animation_scale 0.0
        adb shell settings put global transition_animation_scale 0.0
        adb shell settings put global animator_duration_scale 0.0
    - name: Run E2E Integration Test in Android Emulator
      run: ./mobile/mobile_e2e.sh test
    - name: Stop the emulator
      if: always()
      run: adb emu kill || true

