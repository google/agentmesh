# Native SDKs (sdk/): unit tests per language, then both SDKs on a mesh with
# a real control plane, router and agentmesh-node through tests/integration, and
# the example programs the docs embed run the same way. api/agentmesh.proto is a
# trigger because the SDKs ship bindings generated from it; the docs are
# because they embed the examples.
name: SDK

on:
  push:
    branches: [main]
    paths:
      - 'sdk/**'
      - 'development/tools/agentmesh-cop/**'
      - 'api/agentmesh.proto'
      - 'hack/gen-sdk-proto.sh'
      - 'hack/gen-sdk-docs/**'
      - 'hack/verify-sdk-generated.sh'
      - 'site/content/docs/guides/native-sdks.md'
      - 'tests/integration/sdk_*_test.go'
      - 'Dockerfile.agentmesh-sdk-*'
      - '.github/workflows/sdk.yml'
  pull_request:
    branches: [main]
    paths:
      - 'sdk/**'
      - 'development/tools/agentmesh-cop/**'
      - 'api/agentmesh.proto'
      - 'hack/gen-sdk-proto.sh'
      - 'hack/gen-sdk-docs/**'
      - 'hack/verify-sdk-generated.sh'
      - 'site/content/docs/guides/native-sdks.md'
      - 'tests/integration/sdk_*_test.go'
      - 'Dockerfile.agentmesh-sdk-*'
      - '.github/workflows/sdk.yml'

permissions:
  contents: read

env:
  GO_VERSION: "1.26"

jobs:
  sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: sdk/js/package-lock.json

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install protoc and py-libp2p build dependencies
        # fastecdsa (a py-libp2p dependency) ships as a source distribution
        # and builds against GMP.
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libgmp-dev

      - name: JavaScript SDK
        run: make sdk-js

      - name: Python SDK
        run: make sdk-python

      - name: Generated bindings, embedded examples and lockfile are current
        run: ./hack/verify-sdk-generated.sh

      - name: Both SDKs and the documented examples on a mesh with a real control plane, router and agentmesh-node
        run: go test ./tests/integration -run TestNativeSDK -count=1 -v

      # The images the testnets run the examples from (deploy.yaml builds and
      # pushes them on main); built here so a broken Dockerfile fails the
      # pull request, not the deploy.
      - name: SDK canary images build
        run: |
          docker build -f Dockerfile.agentmesh-sdk-js -t agentmesh-sdk-js:ci .
          docker build -f Dockerfile.agentmesh-sdk-python -t agentmesh-sdk-python:ci .
          # Without a token every example stops at enrollment with this
          # message: the default command (the agent), the caller, and the
          # two written with the official A2A SDK.
          docker run --rm agentmesh-sdk-js:ci 2>&1 | grep -q 'exactly one of'
          docker run --rm agentmesh-sdk-python:ci 2>&1 | grep -q 'exactly one of'
          docker run --rm agentmesh-sdk-js:ci build/examples/call.js 2>&1 | grep -q 'exactly one of'
          docker run --rm agentmesh-sdk-python:ci examples/call.py 2>&1 | grep -q 'exactly one of'
          docker run --rm agentmesh-sdk-js:ci build/examples/a2a-agent.js 2>&1 | grep -q 'exactly one of'
          docker run --rm agentmesh-sdk-python:ci examples/a2a_agent.py 2>&1 | grep -q 'exactly one of'
          docker run --rm agentmesh-sdk-js:ci build/examples/a2a-call.js peer 2>&1 | grep -q 'exactly one of'
          docker run --rm agentmesh-sdk-python:ci examples/a2a_call.py peer 2>&1 | grep -q 'exactly one of'
