name: member-journey

# Thirty members join one mesh at the same time from one host, then more join
# behind them while the first ones stay resident. It is the join path under
# concurrency, which no other suite exercises, and it keeps the harness that
# runs the same journey at hundreds of members against a testnet
# (tests/scale/member-journey.sh --env bananas) from rotting between
# releases. A runner is a noisy place, so the latency bounds are loose; the
# checks that gate are the ones that count: every member completed, nobody
# dropped during the hold. Loopback is exempt from the routers' per-source
# limits, so what this cannot see is what a shared public address sees.

on:
  push:
    branches:
      - "main"
  workflow_dispatch:
    inputs:
      count:
        description: "Members in the burst"
        default: "30"
      hold:
        description: "How long the burst fleet stays resident"
        default: "20s"

permissions:
  contents: read

env:
  GO_VERSION: "1.26"
  CONTROL_PLANE: http://127.0.0.1:18090

jobs:
  member_journey:
    runs-on: ubuntu-22.04
    name: Member journey
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Build binaries
        run: |
          go build -o bin/agentmesh-one ./cmd/agentmesh-one
          go build -o bin/agentmesh-node ./cmd/agentmesh-node
          go build -o bin/agentmesh-bench ./cmd/agentmesh-bench
          go build -o bin/stdio-mcp ./tests/scale/stdio-mcp

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install the Python MCP SDK
        run: python -m pip install --quiet "mcp>=2,<3"

      - name: Start a local mesh
        # agentmesh-one is the control plane and the router on one port; its first
        # boot writes the join token every member enrolls with.
        run: |
          mkdir -p "$RUNNER_TEMP/mesh"
          bin/agentmesh-one --data-dir "$RUNNER_TEMP/mesh" --port 18090 --bind-address 127.0.0.1 \
            > "$RUNNER_TEMP/agentmesh-one.log" 2>&1 &
          for _ in $(seq 1 60); do
            curl -fsS -o /dev/null "$CONTROL_PLANE/readyz" 2>/dev/null && break
            sleep 1
          done
          curl -fsS -o /dev/null "$CONTROL_PLANE/readyz"
          test -s "$RUNNER_TEMP/mesh/join-token"

      - name: Start the providers
        # Two nodes advertising the MCP service the members will look up and
        # call, one backed by the Go SDK's stdio server and one by the Python
        # SDK's, so a member's first call lands on a real server in either
        # language and discovery has more than one record to return.
        run: |
          i=0
          for backend in "$GITHUB_WORKSPACE/bin/stdio-mcp" "$(command -v python) $GITHUB_WORKSPACE/tests/scale/stdio-mcp.py"; do
            i=$((i + 1))
            dir="$RUNNER_TEMP/provider-$i"
            mkdir -p "$dir"
            command_json=$(python -c 'import json, sys; print(json.dumps(sys.argv[1].split()))' "$backend")
            cat > "$dir/agentmesh-node.yaml" <<EOF
          version: "v1alpha1"
          services:
            - type: "mcp"
              name: "everything"
              description: "member-journey provider $i"
              command: $command_json
          EOF
            bin/agentmesh-node run \
              --control-plane "$CONTROL_PLANE" \
              --bootstrap-token-path "$RUNNER_TEMP/mesh/join-token" \
              --config "$dir/agentmesh-node.yaml" \
              --data-dir "$dir" \
              --bind-addr= \
              --socket-path "$dir/node.sock" \
              --metrics-addr "127.0.0.1:1909$i" \
              --allow-loopback \
              --listen /ip4/127.0.0.1/tcp/0 \
              > "$RUNNER_TEMP/provider-$i.log" 2>&1 &
          done
          for i in 1 2; do
            for _ in $(seq 1 60); do
              [ "$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:1909$i/readyz")" = "200" ] && break
              sleep 1
            done
            [ "$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:1909$i/readyz")" = "200" ]
            grep -q 'Registered SERVICE_TYPE_MCP/everything' "$RUNNER_TEMP/provider-$i.log"
          done

      - name: Run the member journey
        env:
          COUNT: ${{ inputs.count || '30' }}
          HOLD: ${{ inputs.hold || '20s' }}
          # Loose on purpose: a runner's latency says nothing about the mesh.
          T_JOURNEY_P50_MS: "20000"
          T_JOURNEY_P95_MS: "60000"
        run: |
          tests/scale/member-journey.sh \
            --control-plane "$CONTROL_PLANE" \
            --bootstrap-token-path "$RUNNER_TEMP/mesh/join-token" \
            --node-arg=--allow-loopback \
            --node-arg=--listen=/ip4/127.0.0.1/tcp/0 \
            --count "$COUNT" --late 5 --ramp 10 --hold "$HOLD" \
            --out "$RUNNER_TEMP/journey" 2>&1 | tee "$RUNNER_TEMP/journey.out"
          test "${PIPESTATUS[0]}" -eq 0

      - name: Publish the table
        if: always()
        run: |
          {
            echo "## Member journey"
            echo
            sed -n '/^| phase/,$p' "$RUNNER_TEMP/journey.out" 2>/dev/null || echo "no summary was produced"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Collect observations and logs
        if: always()
        run: |
          mkdir -p _artifacts
          cp "$RUNNER_TEMP"/journey/*.json "$RUNNER_TEMP"/journey/*.log "$RUNNER_TEMP"/journey/*.jsonl _artifacts/ 2>/dev/null || true
          cp "$RUNNER_TEMP"/agentmesh-one.log "$RUNNER_TEMP"/provider-*.log _artifacts/ 2>/dev/null || true

      - name: Upload observations
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: member-journey-${{ github.run_id }}
          path: _artifacts/
          retention-days: 14
