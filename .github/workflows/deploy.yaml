name: Deploy Agent Mesh Hub

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:

# Serialize deploys per-environment so a burst of pushes (e.g. several
# dependabot PRs merging back-to-back) can't run concurrently against the
# same GKE namespace and race on shared resources (e.g. the dns-sync-rollout
# job name). Keeps only the latest queued run per environment; never cancels
# one already in progress.
concurrency:
  group: deploy-${{ github.ref_type == 'tag' && 'hub' || 'bananas' }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    name: Publish Images
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    timeout-minutes: 100
    
    steps:
    - name: Check out code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up QEMU
      uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

    - name: Log in to the Container registry
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata for Control Plane
      id: meta-cp
      uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
      with:
        images: ${{ env.REGISTRY }}/google/agentmesh-control-plane
        tags: |
          type=ref,event=branch
          type=ref,event=tag
          type=raw,value=${{ github.sha }}
          type=raw,value=latest,enable={{is_default_branch}}
          type=raw,value=stable,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

    - name: Build and push Control Plane image
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .
        file: Dockerfile.agentmesh-control-plane
        build-args: VERSION=${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
        platforms: ${{ github.ref_type == 'tag' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
        push: true
        tags: ${{ steps.meta-cp.outputs.tags }}
        labels: ${{ steps.meta-cp.outputs.labels }}

    - name: Extract metadata for Router
      id: meta-router
      uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
      with:
        images: ${{ env.REGISTRY }}/google/agentmesh-router
        tags: |
          type=ref,event=branch
          type=ref,event=tag
          type=raw,value=${{ github.sha }}
          type=raw,value=latest,enable={{is_default_branch}}
          type=raw,value=stable,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

    - name: Build and push Router image
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .
        file: Dockerfile.agentmesh-router
        build-args: VERSION=${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
        platforms: ${{ github.ref_type == 'tag' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
        push: true
        tags: ${{ steps.meta-router.outputs.tags }}
        labels: ${{ steps.meta-router.outputs.labels }}

    - name: Extract metadata for Node
      id: meta-node
      uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
      with:
        images: ${{ env.REGISTRY }}/google/agentmesh-node
        tags: |
          type=ref,event=branch
          type=ref,event=tag
          type=raw,value=${{ github.sha }}
          type=raw,value=latest,enable={{is_default_branch}}
          type=raw,value=stable,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

    - name: Build and push Node image
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .
        file: Dockerfile.agentmesh-node
        build-args: VERSION=${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
        platforms: ${{ github.ref_type == 'tag' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
        push: true
        tags: ${{ steps.meta-node.outputs.tags }}
        labels: ${{ steps.meta-node.outputs.labels }}

    - name: Extract metadata for agentmesh-console
      id: meta-console
      uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
      with:
        images: ${{ env.REGISTRY }}/google/agentmesh-console
        tags: |
          type=ref,event=branch
          type=ref,event=tag
          type=raw,value=${{ github.sha }}
          type=raw,value=latest,enable={{is_default_branch}}
          type=raw,value=stable,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

    - name: Build and push agentmesh-console image
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .
        file: Dockerfile.agentmesh-console
        build-args: VERSION=${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
        platforms: ${{ github.ref_type == 'tag' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
        push: true
        tags: ${{ steps.meta-console.outputs.tags }}
        labels: ${{ steps.meta-console.outputs.labels }}

    - name: Extract metadata for agentmesh-one
      id: meta-agentmesh-one
      uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
      with:
        images: ${{ env.REGISTRY }}/google/agentmesh-one
        tags: |
          type=ref,event=branch
          type=ref,event=tag
          type=raw,value=${{ github.sha }}
          type=raw,value=latest,enable={{is_default_branch}}
          type=raw,value=stable,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

    - name: Build and push agentmesh-one image
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .
        file: Dockerfile.agentmesh-one
        build-args: VERSION=${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
        platforms: ${{ github.ref_type == 'tag' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
        push: true
        tags: ${{ steps.meta-agentmesh-one.outputs.tags }}
        labels: ${{ steps.meta-agentmesh-one.outputs.labels }}

    # The SDK images carry the example programs the docs embed, as the
    # testnet canaries and probes run them. Built from the commit, not from
    # npm or PyPI, so bananas exercises the SDK at the same commit as the
    # Go components it talks to.
    - name: Extract metadata for agentmesh-sdk-js
      id: meta-sdk-js
      uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
      with:
        images: ${{ env.REGISTRY }}/google/agentmesh-sdk-js
        tags: |
          type=ref,event=branch
          type=ref,event=tag
          type=raw,value=${{ github.sha }}
          type=raw,value=latest,enable={{is_default_branch}}
          type=raw,value=stable,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

    - name: Build and push agentmesh-sdk-js image
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .
        file: Dockerfile.agentmesh-sdk-js
        platforms: ${{ github.ref_type == 'tag' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
        push: true
        tags: ${{ steps.meta-sdk-js.outputs.tags }}
        labels: ${{ steps.meta-sdk-js.outputs.labels }}

    - name: Extract metadata for agentmesh-sdk-python
      id: meta-sdk-python
      uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
      with:
        images: ${{ env.REGISTRY }}/google/agentmesh-sdk-python
        tags: |
          type=ref,event=branch
          type=ref,event=tag
          type=raw,value=${{ github.sha }}
          type=raw,value=latest,enable={{is_default_branch}}
          type=raw,value=stable,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

    - name: Build and push agentmesh-sdk-python image
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .
        file: Dockerfile.agentmesh-sdk-python
        platforms: ${{ github.ref_type == 'tag' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
        push: true
        tags: ${{ steps.meta-sdk-python.outputs.tags }}
        labels: ${{ steps.meta-sdk-python.outputs.labels }}

  deploy:
    name: Deploy to GKE
    runs-on: ubuntu-latest
    needs: publish
    # Dynamically select the GitHub Environment based on the trigger
    environment: ${{ github.ref_type == 'tag' && 'hub' || 'bananas' }}
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Determine Image Tag
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          if [[ "${REF_TYPE}" == "tag" ]]; then
            echo "IMAGE_TAG=${REF_NAME}" >> $GITHUB_ENV
          else
            echo "IMAGE_TAG=${COMMIT_SHA}" >> $GITHUB_ENV
          fi

      - name: Google Auth
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER_NAME }}
          service_account: ${{ vars.SERVICE_ACCOUNT_EMAIL }}

      - name: Set up GKE credentials
        uses: google-github-actions/get-gke-credentials@3da1e46a907576cefaa90c484278bb5b259dd395 # v3.0.0
        with:
          cluster_name: ${{ vars.CLUSTER_NAME }}
          location: ${{ vars.CLUSTER_REGION }}

      - name: Prepare Namespaces
        env:
          VAR_ENV_NAME: ${{ vars.ENV_NAME }}
        run: |
          export ENV_NAME="${VAR_ENV_NAME}"
          export NAMESPACE="sam-${ENV_NAME}"
          export CANARY_NAMESPACE="agentmesh-canary-${ENV_NAME}"
          
          kubectl create namespace dex --dry-run=client -o yaml | kubectl apply -f -
          kubectl create namespace ${NAMESPACE} --dry-run=client -o yaml | kubectl apply -f -
          kubectl create namespace ${CANARY_NAMESPACE} --dry-run=client -o yaml | kubectl apply -f -
          envsubst '${ENV_NAME}' < .github/k8s/agentmesh-canary-sa-template.yaml | kubectl apply -f -

      - name: Provision Dex Secrets
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GITHUB_CLIENT_ID: ${{ secrets.GHUB_CLIENT_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.GHUB_CLIENT_SECRET }}
          CLI_OAUTH_SECRET: ${{ secrets.CLI_OAUTH_SECRET }}
        run: |
          # Declaratively apply secrets without writing them to disk
          kubectl create secret generic dex-secrets \
            --namespace=dex \
            --from-literal=google-client-id="${GOOGLE_CLIENT_ID}" \
            --from-literal=google-client-secret="${GOOGLE_CLIENT_SECRET}" \
            --from-literal=github-client-id="${GITHUB_CLIENT_ID}" \
            --from-literal=github-client-secret="${GITHUB_CLIENT_SECRET}" \
            --from-literal=cli-oauth-secret="${CLI_OAUTH_SECRET}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy Dex Resources
        run: |
          print_rollout_diagnostics() {
            local namespace="$1"
            local deployment="$2"
            local selector="$3"

            echo "Collecting diagnostics for deployment/${deployment} in namespace ${namespace}..."

            kubectl describe deployment/${deployment} -n ${namespace} || true
            kubectl get pods -n ${namespace} -l "${selector}" -o wide || true
            kubectl describe pods -n ${namespace} -l "${selector}" || true
            kubectl get events -n ${namespace} --sort-by=.lastTimestamp || true

            for pod in $(kubectl get pods -n ${namespace} -l "${selector}" -o name 2>/dev/null); do
              echo "==== Describe ${pod} ===="
              kubectl describe -n ${namespace} "${pod}" || true

              for container in $(kubectl get -n ${namespace} "${pod}" -o jsonpath='{.spec.containers[*].name}' 2>/dev/null); do
                echo "==== Logs for ${pod} container ${container} ===="
                kubectl logs -n ${namespace} "${pod#pod/}" -c "${container}" --tail=-1 || true
              done
            done
          }

          # Apply the Dex manifests
          kubectl apply -f .github/k8s/dex-config.yaml
          kubectl apply -f .github/k8s/dex-deployment.yaml
          
          # Force a restart to pick up any changes to the secrets, and wait for readiness
          kubectl rollout restart deployment/dex -n dex
          kubectl rollout status deployment/dex -n dex --timeout=120s || {
            echo "Dex Deployment failed!"
            print_rollout_diagnostics "dex" "dex" "app=dex"

            echo "Rolling back Dex deployment..."
            kubectl rollout undo deployment/dex -n dex
            exit 1
          }

      - name: Provision Control Plane Secrets
        env:
          VAR_ENV_NAME: ${{ vars.ENV_NAME }}
        run: |
          export ENV_NAME="${VAR_ENV_NAME}"
          export NAMESPACE="sam-${ENV_NAME}"
          if ! kubectl get secret agentmesh-control-plane-secret-${ENV_NAME} -n ${NAMESPACE} >/dev/null 2>&1; then
            echo "Generating new random secrets for admin-token and the DB..."
            ADMIN_TOKEN=$(openssl rand -hex 32)
            DB_PASSWORD=$(openssl rand -hex 32)
            DB_DSN="postgres://sam:${DB_PASSWORD}@sam-db-${ENV_NAME}:5432/sam_mesh?sslmode=disable"
            echo "::add-mask::${ADMIN_TOKEN}"
            echo "::add-mask::${DB_PASSWORD}"
            kubectl create secret generic agentmesh-control-plane-secret-${ENV_NAME} \
              --namespace=${NAMESPACE} \
              --from-literal=admin-token="${ADMIN_TOKEN}" \
              --from-literal=db-password="${DB_PASSWORD}" \
              --from-literal=db-dsn="${DB_DSN}"
          else
            echo "agentmesh-control-plane-secret-${ENV_NAME} already exists in namespace ${NAMESPACE}. Skipping generation."
          fi

      - name: Deploy Control Plane and Routers
        env:
          VAR_ENV_NAME: ${{ vars.ENV_NAME }}
          VAR_IMAGE_TAG: ${{ env.IMAGE_TAG }}
          VAR_GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          VAR_CLUSTER_REGION: ${{ vars.CLUSTER_REGION }}
          VAR_CLUSTER_NAME: ${{ vars.CLUSTER_NAME }}
        run: |
          print_rollout_diagnostics() {
            local namespace="$1"
            local resource="$2"
            local selector="$3"

            echo "Collecting diagnostics for ${resource} in namespace ${namespace}..."

            kubectl describe ${resource} -n ${namespace} || true
            kubectl get pods -n ${namespace} -l "${selector}" -o wide || true
            kubectl describe pods -n ${namespace} -l "${selector}" || true
            kubectl get events -n ${namespace} --sort-by=.lastTimestamp || true

            for pod in $(kubectl get pods -n ${namespace} -l "${selector}" -o name 2>/dev/null); do
              echo "==== Describe ${pod} ===="
              kubectl describe -n ${namespace} "${pod}" || true

              for container in $(kubectl get -n ${namespace} "${pod}" -o jsonpath='{.spec.containers[*].name}' 2>/dev/null); do
                echo "==== Logs for ${pod} container ${container} ===="
                kubectl logs -n ${namespace} "${pod#pod/}" -c "${container}" --tail=-1 || true
              done
            done
          }

          sudo apt-get install -y gettext-base
          
          export ENV_NAME="${VAR_ENV_NAME}"
          export NAMESPACE="sam-${ENV_NAME}"
          export IMAGE_TAG="${VAR_IMAGE_TAG}"
          export GCP_PROJECT_ID="${VAR_GCP_PROJECT_ID}"
          export CLUSTER_REGION="${VAR_CLUSTER_REGION}"
          export CLUSTER_NAME="${VAR_CLUSTER_NAME}"

          envsubst '${ENV_NAME} ${NAMESPACE} ${GCP_PROJECT_ID} ${CLUSTER_NAME} ${CLUSTER_REGION} ${IMAGE_TAG}' < .github/k8s/agentmesh-control-plane-template.yaml | kubectl apply -f -
          envsubst '${ENV_NAME} ${NAMESPACE} ${GCP_PROJECT_ID} ${CLUSTER_NAME} ${CLUSTER_REGION} ${IMAGE_TAG}' < .github/k8s/agentmesh-router-template.yaml | kubectl apply -f -
          envsubst '${ENV_NAME} ${NAMESPACE} ${GCP_PROJECT_ID} ${CLUSTER_NAME} ${CLUSTER_REGION} ${IMAGE_TAG}' < .github/k8s/agentmesh-console-template.yaml | kubectl apply -f -
          envsubst '${ENV_NAME} ${NAMESPACE} ${GCP_PROJECT_ID}' < .github/k8s/dns-sync-cronjob-template.yaml | kubectl apply -f -
          # Managed Prometheus ships with GKE; a cluster without it should not block the mesh rollout.
          if kubectl get crd podmonitorings.monitoring.googleapis.com >/dev/null 2>&1; then
            envsubst '${ENV_NAME} ${NAMESPACE}' < .github/k8s/agentmesh-monitoring-template.yaml | kubectl apply -f -
          else
            echo "::warning::PodMonitoring CRD not found; managed collection is off on this cluster, metrics will not be scraped"
          fi
          
          # The pod is Ready only once the load balancer's NEG controller has
          # seen it healthy, which has taken anywhere from half a minute to
          # several minutes; two replicas roll one after the other.
          kubectl rollout status deployment/agentmesh-control-plane-${ENV_NAME} -n ${NAMESPACE} --timeout=600s || {
            echo "Control Plane Deployment failed!"
            print_rollout_diagnostics "${NAMESPACE}" "deployment/agentmesh-control-plane-${ENV_NAME}" "app=agentmesh-control-plane-${ENV_NAME}"
            exit 1
          }

          echo "Seeding Control Plane Policies..."
          ADMIN_TOKEN=$(kubectl get secret agentmesh-control-plane-secret-${ENV_NAME} -n ${NAMESPACE} -o jsonpath='{.data.admin-token}' | base64 -d)
          echo "::add-mask::${ADMIN_TOKEN}"
          
          kubectl port-forward deployment/agentmesh-control-plane-${ENV_NAME} -n ${NAMESPACE} 8080:8080 &
          PF_PID=$!
          
          for i in {1..15}; do
            if nc -z localhost 8080; then
              break
            fi
            sleep 1
          done
          
          curl -fsS -X POST \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${ADMIN_TOKEN}" \
            -d '{
              "roles": [
                {"name": "agentmesh-canary", "allowed_services": ["*"], "allowed_targets": ["*"]},
                {"name": "mesh:role:router", "allowed_services": ["*"], "allowed_targets": ["*"]},
                {"name": "mesh:role:node"},
                {"name": "public-mesh", "allowed_services": ["*"], "allowed_targets": ["*"]}
              ],
              "bindings": [
                {"role": "agentmesh-canary", "members": ["user:system:serviceaccount:agentmesh-canary-'"${ENV_NAME}"':agentmesh-node-sa"]},
                {"role": "mesh:role:router", "members": ["group:routers", "user:system:serviceaccount:'"${NAMESPACE}"':agentmesh-router-sa"]},
                {"role": "mesh:role:node", "members": ["mesh:system:authenticated"]},
                {"role": "public-mesh", "members": ["mesh:system:authenticated"]}
              ]
            }' \
            http://localhost:8080/policies || {
            echo "Policy seeding failed - a rejected policy leaves enrollment broken (nodes get 403 at /register)."
            kill $PF_PID
            exit 1
          }
            
          kill $PF_PID


          kubectl rollout status deployment/agentmesh-console-${ENV_NAME} -n ${NAMESPACE} --timeout=120s || {
            echo "Console Deployment failed!"
            print_rollout_diagnostics "${NAMESPACE}" "deployment/agentmesh-console-${ENV_NAME}" "app=agentmesh-console-${ENV_NAME}"
            exit 1
          }

          # Three routers, each held 90s after it is ready (minReadySeconds)
          # so members re-attach before the next one goes.
          kubectl rollout status statefulset/agentmesh-router-${ENV_NAME} -n ${NAMESPACE} --timeout=600s || {
            echo "Router Deployment failed!"
            print_rollout_diagnostics "${NAMESPACE}" "statefulset/agentmesh-router-${ENV_NAME}" "app=agentmesh-router-${ENV_NAME}"

            echo "Rolling back Router deployment..."
            kubectl rollout undo statefulset/agentmesh-router-${ENV_NAME} -n ${NAMESPACE}
            kubectl rollout status statefulset/agentmesh-router-${ENV_NAME} -n ${NAMESPACE}
            exit 1
          }

          echo "Triggering immediate DNS sync after rollout..."
          kubectl delete job dns-sync-rollout-${ENV_NAME} -n ${NAMESPACE} --ignore-not-found || true
          kubectl create job --from=cronjob/dns-sync-cronjob dns-sync-rollout-${ENV_NAME} -n ${NAMESPACE}
          echo "Waiting for DNS sync job to complete..."
          kubectl wait --for=condition=complete job/dns-sync-rollout-${ENV_NAME} -n ${NAMESPACE} --timeout=180s || {
            echo "DNS sync job failed or timed out!"
            kubectl describe job/dns-sync-rollout-${ENV_NAME} -n ${NAMESPACE}
            kubectl logs -n ${NAMESPACE} -l job-name=dns-sync-rollout-${ENV_NAME} --tail=-1 || true
            exit 1
          }


      - name: Deploy GCE VM Router
        env:
          VAR_ENV_NAME: ${{ vars.ENV_NAME }}
          VAR_IMAGE_TAG: ${{ env.IMAGE_TAG }}
          VAR_GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          VAR_CLUSTER_REGION: ${{ vars.CLUSTER_REGION }}
        run: |
          export ENV_NAME="${VAR_ENV_NAME}"
          export NAMESPACE="sam-${ENV_NAME}"
          export IMAGE_TAG="${VAR_IMAGE_TAG}"
          export GCP_PROJECT_ID="${VAR_GCP_PROJECT_ID}"
          export CLUSTER_REGION="${VAR_CLUSTER_REGION}"
          export ZONE="${CLUSTER_REGION}-a"

          echo "Retrieving Admin Token to generate Bootstrap Token..."
          ADMIN_TOKEN=$(kubectl get secret agentmesh-control-plane-secret-${ENV_NAME} -n ${NAMESPACE} -o jsonpath='{.data.admin-token}' | base64 -d)
          echo "::add-mask::${ADMIN_TOKEN}"

          # Mint the token from the runner over a port-forward: a helper pod
          # would carry the admin token in its spec, where kubectl describe
          # and anyone with pod read access can see it.
          echo "Generating Bootstrap Token via port-forward to the Control Plane..."
          kubectl port-forward deployment/agentmesh-control-plane-${ENV_NAME} -n ${NAMESPACE} 8080:8080 &
          PF_PID=$!
          for i in {1..15}; do
            if nc -z localhost 8080; then
              break
            fi
            sleep 1
          done

          TOKEN_JSON=$(curl -fsS -X POST \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${ADMIN_TOKEN}" \
            -d '{"role": "mesh:role:router", "max_usages": 1}' \
            http://localhost:8080/admin/bootstrap-tokens) || {
            echo "ERROR: bootstrap token request failed"
            kill $PF_PID
            exit 1
          }
          kill $PF_PID

          BOOTSTRAP_TOKEN=$(echo "${TOKEN_JSON}" | jq -r .token)
          if [ -z "${BOOTSTRAP_TOKEN}" ] || [ "${BOOTSTRAP_TOKEN}" = "null" ]; then
            echo "ERROR: Generated bootstrap token is empty or invalid!"
            echo "Response (token redacted): $(echo "${TOKEN_JSON}" | jq -c 'del(.token)' 2>/dev/null || echo '<not JSON>')"
            exit 1
          fi
          echo "::add-mask::${BOOTSTRAP_TOKEN}"
          
          echo "Successfully generated bootstrap token."

          echo "Provisioning GCE VM Router instance..."
          # Delete existing VM if it exists to ensure fresh deployment with the new token and image
          gcloud compute instances delete agentmesh-router-${ENV_NAME}-vm --zone=${ZONE} --project=${GCP_PROJECT_ID} --quiet || true

          # Create a new COS VM instance running the agentmesh-router. The
          # router is a hub: with 1 GB and a shared core an e2-micro refused
          # handshakes while a fleet joined through it (libp2p sized its
          # stream limits from the memory it saw and the core was at 100%).
          gcloud compute instances create agentmesh-router-${ENV_NAME}-vm \
            --project=${GCP_PROJECT_ID} \
            --zone=${ZONE} \
            --machine-type=e2-small \
            --image-family=cos-stable \
            --image-project=cos-cloud \
            --tags=agentmesh-router \
            --metadata=startup-script='#!/bin/bash
          set -euo pipefail
          EXTERNAL_IP=$(curl -s -H "Metadata-Flavor: Google" http://metadata.google.internal/computeMetadata/v1/instance/network-interfaces/0/access-configs/0/external-ip)
          # COS drops inbound traffic on the host by default; the VPC rule alone does not open the port.
          iptables -w -I INPUT -p tcp --dport 4501 -j ACCEPT
          iptables -w -I INPUT -p udp --dport 4501 -j ACCEPT
          install -d -m 0755 /etc/agentmesh-router
          printf "%s" "'"${BOOTSTRAP_TOKEN}"'" > /etc/agentmesh-router/bootstrap-token
          chown 65532:65532 /etc/agentmesh-router/bootstrap-token
          chmod 0600 /etc/agentmesh-router/bootstrap-token
          docker run -d \
            --name agentmesh-router \
            --network host \
            --restart always \
            -v /etc/agentmesh-router/bootstrap-token:/run/secrets/bootstrap-token:ro \
            ghcr.io/google/agentmesh-router:'"${IMAGE_TAG}"' \
            --control-plane=https://'"${ENV_NAME}"'.sam-mesh.dev \
            --bootstrap-token-path=/run/secrets/bootstrap-token \
            --listen=/ip4/0.0.0.0/tcp/4501 \
            --listen=/ip4/0.0.0.0/udp/4501/quic-v1 \
            --external-addr=/ip4/${EXTERNAL_IP}/tcp/4501 \
            --external-addr=/ip4/${EXTERNAL_IP}/udp/4501/quic-v1 \
            --metrics-addr=127.0.0.1:9090'

      - name: Deploy OpenClaw Canary
        env:
          VAR_ENV_NAME: ${{ vars.ENV_NAME }}
          VAR_IMAGE_TAG: ${{ env.IMAGE_TAG }}
          VAR_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          print_rollout_diagnostics() {
            local namespace="$1"
            local deployment="$2"
            local selector="$3"

            echo "Collecting diagnostics for deployment/${deployment} in namespace ${namespace}..."

            kubectl describe deployment/${deployment} -n ${namespace} || true
            kubectl get pods -n ${namespace} -l "${selector}" -o wide || true
            kubectl describe pods -n ${namespace} -l "${selector}" || true
            kubectl get events -n ${namespace} --sort-by=.lastTimestamp || true

            for pod in $(kubectl get pods -n ${namespace} -l "${selector}" -o name 2>/dev/null); do
              echo "==== Describe ${pod} ===="
              kubectl describe -n ${namespace} "${pod}" || true

              for container in $(kubectl get -n ${namespace} "${pod}" -o jsonpath='{.spec.containers[*].name}' 2>/dev/null); do
                echo "==== Logs for ${pod} container ${container} ===="
                kubectl logs -n ${namespace} "${pod#pod/}" -c "${container}" --tail=-1 || true
              done
            done
          }

          export ENV_NAME="${VAR_ENV_NAME}"
          export CANARY_NAMESPACE="agentmesh-canary-${ENV_NAME}"
          export NAMESPACE="sam-${ENV_NAME}"
          export IMAGE_TAG="${VAR_IMAGE_TAG}"
          export GEMINI_API_KEY="${VAR_GEMINI_API_KEY}"

          GATEWAY_TOKEN=$(kubectl get secret openclaw-secret-${ENV_NAME} -n ${CANARY_NAMESPACE} -o jsonpath="{.data.gateway-token}" 2>/dev/null | base64 -d || true)
          # base64 -d on empty input exits 0, so a missing secret used to yield
          # an empty token here; test the value, not the pipeline status.
          if [ -z "${GATEWAY_TOKEN}" ]; then
            GATEWAY_TOKEN=$(openssl rand -hex 16)
          fi
          echo "::add-mask::${GATEWAY_TOKEN}"
          kubectl create secret generic openclaw-secret-${ENV_NAME} \
            --namespace=${CANARY_NAMESPACE} \
            --from-literal=gateway-token="${GATEWAY_TOKEN}" \
            --from-literal=gemini-api-key="${GEMINI_API_KEY}" \
            --dry-run=client -o yaml | kubectl apply -f -

          # Allow-list the placeholders: ${OPENCLAW_GATEWAY_TOKEN} in the
          # template is a container-runtime shell variable, not ours to expand.
          envsubst '${ENV_NAME} ${NAMESPACE} ${IMAGE_TAG}' < .github/k8s/agentmesh-node-openclaw-template.yaml | kubectl apply -f -
          kubectl rollout status deployment/openclaw-canary-${ENV_NAME} -n ${CANARY_NAMESPACE} --timeout=300s || {
            echo "OpenClaw Canary Deployment failed!"
            print_rollout_diagnostics "${CANARY_NAMESPACE}" "openclaw-canary-${ENV_NAME}" "app=openclaw-canary-${ENV_NAME}"

            echo "Rolling back OpenClaw Canary deployment..."
            kubectl rollout undo deployment/openclaw-canary-${ENV_NAME} -n ${CANARY_NAMESPACE}
            kubectl rollout status deployment/openclaw-canary-${ENV_NAME} -n ${CANARY_NAMESPACE} || true
            exit 1
          }

      - name: Deploy vLLM Canary
        if: vars.ENV_NAME != 'hub'
        env:
          VAR_ENV_NAME: ${{ vars.ENV_NAME }}
          VAR_IMAGE_TAG: ${{ env.IMAGE_TAG }}
          VAR_HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          print_rollout_diagnostics() {
            local namespace="$1"
            local deployment="$2"
            local selector="$3"

            echo "Collecting diagnostics for deployment/${deployment} in namespace ${namespace}..."

            kubectl describe deployment/${deployment} -n ${namespace} || true
            kubectl get pods -n ${namespace} -l "${selector}" -o wide || true
            kubectl describe pods -n ${namespace} -l "${selector}" || true
            kubectl get events -n ${namespace} --sort-by=.lastTimestamp || true

            for pod in $(kubectl get pods -n ${namespace} -l "${selector}" -o name 2>/dev/null); do
              echo "==== Describe ${pod} ===="
              kubectl describe -n ${namespace} "${pod}" || true

              for container in $(kubectl get -n ${namespace} "${pod}" -o jsonpath='{.spec.containers[*].name}' 2>/dev/null); do
                echo "==== Logs for ${pod} container ${container} ===="
                kubectl logs -n ${namespace} "${pod#pod/}" -c "${container}" --tail=-1 || true
              done
            done
          }

          export ENV_NAME="${VAR_ENV_NAME}"
          export CANARY_NAMESPACE="agentmesh-canary-${ENV_NAME}"
          export NAMESPACE="sam-${ENV_NAME}"
          export IMAGE_TAG="${VAR_IMAGE_TAG}"
          export HF_TOKEN="${VAR_HF_TOKEN}"

          kubectl create secret generic vllm-secret-${ENV_NAME} \
            --namespace=${CANARY_NAMESPACE} \
            --from-literal=hf-token="${HF_TOKEN}" \
            --dry-run=client -o yaml | kubectl apply -f -

          envsubst '${ENV_NAME} ${NAMESPACE} ${IMAGE_TAG}' < .github/k8s/agentmesh-node-vllm-template.yaml | kubectl apply -f -
          kubectl rollout status deployment/vllm-canary-${ENV_NAME} -n ${CANARY_NAMESPACE} --timeout=300s || {
            echo "vLLM Canary Deployment failed!"
            print_rollout_diagnostics "${CANARY_NAMESPACE}" "vllm-canary-${ENV_NAME}" "app=vllm-canary-${ENV_NAME}"

            echo "Rolling back vLLM Canary deployment..."
            kubectl rollout undo deployment/vllm-canary-${ENV_NAME} -n ${CANARY_NAMESPACE}
            kubectl rollout status deployment/vllm-canary-${ENV_NAME} -n ${CANARY_NAMESPACE} || true
            exit 1
          }

      - name: Deploy Everything Canary
        env:
          VAR_ENV_NAME: ${{ vars.ENV_NAME }}
          VAR_IMAGE_TAG: ${{ env.IMAGE_TAG }}
        run: |
          print_rollout_diagnostics() {
            local namespace="$1"
            local deployment="$2"
            local selector="$3"

            echo "Collecting diagnostics for deployment/${deployment} in namespace ${namespace}..."

            kubectl describe deployment/${deployment} -n ${namespace} || true
            kubectl get pods -n ${namespace} -l "${selector}" -o wide || true
            kubectl describe pods -n ${namespace} -l "${selector}" || true
            kubectl get events -n ${namespace} --sort-by=.lastTimestamp || true

            for pod in $(kubectl get pods -n ${namespace} -l "${selector}" -o name 2>/dev/null); do
              echo "==== Describe ${pod} ===="
              kubectl describe -n ${namespace} "${pod}" || true

              for container in $(kubectl get -n ${namespace} "${pod}" -o jsonpath='{.spec.containers[*].name}' 2>/dev/null); do
                echo "==== Logs for ${pod} container ${container} ===="
                kubectl logs -n ${namespace} "${pod#pod/}" -c "${container}" --tail=-1 || true
              done
            done
          }

          export ENV_NAME="${VAR_ENV_NAME}"
          export CANARY_NAMESPACE="agentmesh-canary-${ENV_NAME}"
          export NAMESPACE="sam-${ENV_NAME}"
          export IMAGE_TAG="${VAR_IMAGE_TAG}"

          envsubst '${ENV_NAME} ${NAMESPACE} ${IMAGE_TAG}' < .github/k8s/agentmesh-node-everything-template.yaml | kubectl apply -f -
          kubectl rollout status deployment/everything-canary-${ENV_NAME} -n ${CANARY_NAMESPACE} --timeout=120s || {
            echo "Everything Canary Deployment failed!"
            print_rollout_diagnostics "${CANARY_NAMESPACE}" "everything-canary-${ENV_NAME}" "app=everything-canary-${ENV_NAME}"

            echo "Rolling back Everything Canary deployment..."
            kubectl rollout undo deployment/everything-canary-${ENV_NAME} -n ${CANARY_NAMESPACE}
            kubectl rollout status deployment/everything-canary-${ENV_NAME} -n ${CANARY_NAMESPACE} || true
            exit 1
          }

      # A resident fleet of plain members that join and stay. Its readiness
      # is each node's /readyz, so this rollout only completes once every
      # member holds a router, and every later deploy restarts the routers
      # under it.
      - name: Deploy Soak Fleet
        env:
          VAR_ENV_NAME: ${{ vars.ENV_NAME }}
          VAR_IMAGE_TAG: ${{ env.IMAGE_TAG }}
        run: |
          export ENV_NAME="${VAR_ENV_NAME}"
          export CANARY_NAMESPACE="agentmesh-canary-${ENV_NAME}"
          export NAMESPACE="sam-${ENV_NAME}"
          export IMAGE_TAG="${VAR_IMAGE_TAG}"

          envsubst '${ENV_NAME} ${NAMESPACE} ${IMAGE_TAG}' < .github/k8s/agentmesh-soak-template.yaml | kubectl apply -f -
          kubectl rollout status deployment/agentmesh-soak-${ENV_NAME} -n ${CANARY_NAMESPACE} --timeout=300s || {
            echo "Soak fleet rollout failed: a member could not join or hold a router."
            kubectl describe deployment/agentmesh-soak-${ENV_NAME} -n ${CANARY_NAMESPACE} || true
            kubectl get pods -n ${CANARY_NAMESPACE} -l app=agentmesh-soak-${ENV_NAME} -o wide || true
            for pod in $(kubectl get pods -n ${CANARY_NAMESPACE} -l app=agentmesh-soak-${ENV_NAME} -o name | head -3); do
              echo "==== ${pod} ===="
              kubectl logs -n ${CANARY_NAMESPACE} "${pod#pod/}" --tail=40 || true
            done
            exit 1
          }

      # Two long-lived pairs with no agentmesh-node: an agent written with one SDK
      # and the official A2A SDK, and a caller written with the other that
      # sends it a message with the A2A SDK's client every few minutes, by
      # peer ID. The caller's readiness is the last call's outcome.
      - name: Deploy SDK Canaries
        env:
          VAR_ENV_NAME: ${{ vars.ENV_NAME }}
          VAR_IMAGE_TAG: ${{ env.IMAGE_TAG }}
        run: |
          export ENV_NAME="${VAR_ENV_NAME}"
          export CANARY_NAMESPACE="agentmesh-canary-${ENV_NAME}"
          export NAMESPACE="sam-${ENV_NAME}"
          export IMAGE_TAG="${VAR_IMAGE_TAG}"

          # The SDK canaries that published services, replaced by these.
          kubectl delete deployment js-canary-${ENV_NAME} python-canary-${ENV_NAME} -n ${CANARY_NAMESPACE} --ignore-not-found
          envsubst '${ENV_NAME} ${NAMESPACE} ${IMAGE_TAG}' < .github/k8s/agentmesh-sdk-canary-template.yaml | kubectl apply -f -
          for lang in js python; do
            kubectl rollout status deployment/${lang}-agent-canary-${ENV_NAME} -n ${CANARY_NAMESPACE} --timeout=180s || {
              echo "${lang} agent canary deployment failed: the other SDK's caller could not reach the agent."
              kubectl describe deployment/${lang}-agent-canary-${ENV_NAME} -n ${CANARY_NAMESPACE} || true
              kubectl get pods -n ${CANARY_NAMESPACE} -l app=${lang}-agent-canary-${ENV_NAME} -o wide || true
              kubectl describe pods -n ${CANARY_NAMESPACE} -l app=${lang}-agent-canary-${ENV_NAME} || true
              for c in agent caller; do
                echo "==== ${c} log ===="
                kubectl logs -n ${CANARY_NAMESPACE} -l app=${lang}-agent-canary-${ENV_NAME} -c ${c} --tail=-1 || true
              done

              echo "Rolling back ${lang} agent canary deployment..."
              kubectl rollout undo deployment/${lang}-agent-canary-${ENV_NAME} -n ${CANARY_NAMESPACE}
              kubectl rollout status deployment/${lang}-agent-canary-${ENV_NAME} -n ${CANARY_NAMESPACE} || true
              exit 1
            }
          done

      - name: Deploy OpenRouter Node to Testnet
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          VAR_ENV_NAME: ${{ vars.ENV_NAME }}
          VAR_IMAGE_TAG: ${{ env.IMAGE_TAG }}
        run: |
          print_rollout_diagnostics() {
            local namespace="$1"
            local deployment="$2"
            local selector="$3"

            echo "Collecting diagnostics for deployment/${deployment} in namespace ${namespace}..."

            kubectl describe deployment/${deployment} -n ${namespace} || true
            kubectl get pods -n ${namespace} -l "${selector}" -o wide || true
            kubectl describe pods -n ${namespace} -l "${selector}" || true
            kubectl get events -n ${namespace} --sort-by=.lastTimestamp || true

            for pod in $(kubectl get pods -n ${namespace} -l "${selector}" -o name 2>/dev/null); do
              echo "==== Describe ${pod} ===="
              kubectl describe -n ${namespace} "${pod}" || true

              for container in $(kubectl get -n ${namespace} "${pod}" -o jsonpath='{.spec.containers[*].name}' 2>/dev/null); do
                echo "==== Logs for ${pod} container ${container} ===="
                kubectl logs -n ${namespace} "${pod#pod/}" -c "${container}" --tail=-1 || true
              done
            done
          }

          export ENV_NAME="${VAR_ENV_NAME}"
          export NAMESPACE="sam-${ENV_NAME}"
          export CANARY_NAMESPACE="agentmesh-canary-${ENV_NAME}"
          export IMAGE_TAG="${VAR_IMAGE_TAG}"

          # The key lives in a Secret the pod references, never in the
          # Deployment spec.
          kubectl create secret generic openrouter-secret-${ENV_NAME} \
            --namespace=${CANARY_NAMESPACE} \
            --from-literal=api-key="${OPENROUTER_API_KEY}" \
            --dry-run=client -o yaml | kubectl apply -f -
          
          envsubst '${ENV_NAME} ${NAMESPACE} ${IMAGE_TAG}' < .github/k8s/agentmesh-node-openrouter-template.yaml | kubectl apply -f -
          
          kubectl rollout status deployment/openrouter-canary-${ENV_NAME} -n ${CANARY_NAMESPACE} --timeout=120s || {
            echo "OpenRouter Canary Deployment failed!"
            print_rollout_diagnostics "${CANARY_NAMESPACE}" "openrouter-canary-${ENV_NAME}" "app=openrouter-canary-${ENV_NAME}"

            echo "Rolling back OpenRouter Canary deployment..."
            kubectl rollout undo deployment/openrouter-canary-${ENV_NAME} -n ${CANARY_NAMESPACE}
            kubectl rollout status deployment/openrouter-canary-${ENV_NAME} -n ${CANARY_NAMESPACE} || true
            exit 1
          }

      # A fresh node enrolls, reaches a router, calls the everything
      # canary's MCP server through the mesh and reaches an agent written
      # with each SDK by peer ID: what a new user does. The CronJob keeps
      # doing it every 15 minutes; running it once here, after every canary
      # is up, makes the rollout prove it before the deploy is called good.
      - name: Deploy and run the cold-path probe
        env:
          VAR_ENV_NAME: ${{ vars.ENV_NAME }}
          VAR_IMAGE_TAG: ${{ env.IMAGE_TAG }}
        run: |
          export ENV_NAME="${VAR_ENV_NAME}"
          export CANARY_NAMESPACE="agentmesh-canary-${ENV_NAME}"
          export NAMESPACE="sam-${ENV_NAME}"
          export IMAGE_TAG="${VAR_IMAGE_TAG}"
          JOB="agentmesh-probe-rollout-${ENV_NAME}"

          envsubst '${ENV_NAME} ${NAMESPACE} ${IMAGE_TAG}' < .github/k8s/agentmesh-probe-cronjob-template.yaml | kubectl apply -f -

          kubectl delete job "${JOB}" -n "${CANARY_NAMESPACE}" --ignore-not-found
          kubectl create job --from="cronjob/agentmesh-probe-${ENV_NAME}" "${JOB}" -n "${CANARY_NAMESPACE}"

          # `kubectl wait` can only wait for one condition; a failed Job would
          # otherwise sit out the whole timeout.
          for _ in $(seq 1 72); do
            status=$(kubectl get job "${JOB}" -n "${CANARY_NAMESPACE}" -o jsonpath='{range .status.conditions[*]}{.type}={.status}{"\n"}{end}')
            case "${status}" in
              *Complete=True*) break ;;
              *Failed=True*) break ;;
            esac
            sleep 5
          done

          echo "==== probe output ===="
          kubectl logs "job/${JOB}" -n "${CANARY_NAMESPACE}" -c probe --tail=-1 || true

          case "${status:-}" in
            *Complete=True*) echo "Cold-path probe passed." ;;
            *)
              echo "Cold-path probe did not pass: a fresh node could not enroll, reach a router, call a mesh service, or reach an SDK agent."
              for c in agentmesh-node js-agent python-agent; do
                echo "==== ${c} sidecar log ===="
                kubectl logs "job/${JOB}" -n "${CANARY_NAMESPACE}" -c "${c}" --tail=200 || true
              done
              kubectl describe job "${JOB}" -n "${CANARY_NAMESPACE}" || true
              exit 1
              ;;
          esac

      # The same cold path through each SDK: an agent written with the A2A
      # SDK and a caller enroll with the JavaScript and the Python SDK; each
      # caller reaches the everything canary's MCP server (a agentmesh-node) by
      # name and the other SDK's agent by peer ID, its card with the mesh
      # SDK's client and a message with the A2A SDK's. With the node probe
      # above, every pair of implementations is crossed in both directions
      # on every rollout and every 15 minutes after.
      - name: Deploy and run the SDK cold-path probe
        env:
          VAR_ENV_NAME: ${{ vars.ENV_NAME }}
          VAR_IMAGE_TAG: ${{ env.IMAGE_TAG }}
        run: |
          export ENV_NAME="${VAR_ENV_NAME}"
          export CANARY_NAMESPACE="agentmesh-canary-${ENV_NAME}"
          export NAMESPACE="sam-${ENV_NAME}"
          export IMAGE_TAG="${VAR_IMAGE_TAG}"
          JOB="agentmesh-sdk-probe-rollout-${ENV_NAME}"

          envsubst '${ENV_NAME} ${NAMESPACE} ${IMAGE_TAG}' < .github/k8s/agentmesh-sdk-probe-cronjob-template.yaml | kubectl apply -f -

          kubectl delete job "${JOB}" -n "${CANARY_NAMESPACE}" --ignore-not-found
          kubectl create job --from="cronjob/agentmesh-sdk-probe-${ENV_NAME}" "${JOB}" -n "${CANARY_NAMESPACE}"

          for _ in $(seq 1 96); do
            status=$(kubectl get job "${JOB}" -n "${CANARY_NAMESPACE}" -o jsonpath='{range .status.conditions[*]}{.type}={.status}{"\n"}{end}')
            case "${status}" in
              *Complete=True*) break ;;
              *Failed=True*) break ;;
            esac
            sleep 5
          done

          for lang in js python; do
            echo "==== ${lang} SDK probe output ===="
            kubectl logs "job/${JOB}" -n "${CANARY_NAMESPACE}" -c "${lang}" --tail=-1 || true
          done

          case "${status:-}" in
            *Complete=True*) echo "SDK cold-path probe passed." ;;
            *)
              echo "SDK cold-path probe did not pass: an SDK could not enroll, reach a router, call a service a node serves, or reach the other SDK's agent."
              for lang in js python; do
                echo "==== ${lang} agent sidecar log ===="
                kubectl logs "job/${JOB}" -n "${CANARY_NAMESPACE}" -c "${lang}-agent" --tail=200 || true
              done
              kubectl describe job "${JOB}" -n "${CANARY_NAMESPACE}" || true
              exit 1
              ;;
          esac

