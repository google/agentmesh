apiVersion: v1
kind: ConfigMap
metadata:
  name: dex
  namespace: dex
data:
  config.yaml: |
    # The public URL where Dex is accessible
    issuer: https://auth.sam-mesh.dev
    
    storage:
      type: kubernetes
      config:
        inCluster: true
        
    web:
      # Serve plain HTTP locally; the GKE Ingress handles HTTPS termination
      http: 0.0.0.0:5556
      # The web app at /node/ reads discovery and trades its sign-in code from the browser.
      allowedOrigins:
      - 'https://bananas.sam-mesh.dev'
      - 'https://hub.sam-mesh.dev'
      
    oauth2:
      grantTypes:
        - "authorization_code"
        - "refresh_token"
        - "urn:ietf:params:oauth:grant-type:device_code"
      skipApprovalScreen: true
      
    connectors:
    - type: google
      id: google
      name: Google
      config:
        clientID: $GOOGLE_CLIENT_ID
        clientSecret: $GOOGLE_CLIENT_SECRET
        redirectURI: https://auth.sam-mesh.dev/callback
        
    - type: github
      id: github
      name: GitHub
      config:
        clientID: $GITHUB_CLIENT_ID
        clientSecret: $GITHUB_CLIENT_SECRET
        redirectURI: https://auth.sam-mesh.dev/callback
        
    staticClients:
    # This ID becomes the 'aud' claim in the JWT consumed by agentmesh-control-plane
    - id: agentmesh-audience
      name: 'Agent Mesh CLI'
      public: true # Allows PKCE flow for CLIs without exposing the secret
      redirectURIs:
      - 'http://127.0.0.1:13000/callback'
      - 'http://127.0.0.1:13001/callback'
      - 'http://127.0.0.1:13002/callback'
      - 'http://127.0.0.1/callback'
      - 'http://localhost/callback'
      - 'https://bananas.sam-mesh.dev/console/auth/callback'
      - 'https://hub.sam-mesh.dev/console/auth/callback'
      - 'https://bananas.sam-mesh.dev/node/'
      - 'https://hub.sam-mesh.dev/node/'
      - 'https://auth.sam-mesh.dev/device/callback'
      - 'urn:ietf:wg:oauth:2.0:oob'
      - '/device/callback'
    - id: sam-mesh-audience
      name: 'Agent Mesh CLI (Legacy)'
      public: true
      redirectURIs:
      - 'http://127.0.0.1:13000/callback'
      - 'http://127.0.0.1:13001/callback'
      - 'http://127.0.0.1:13002/callback'
      - 'http://127.0.0.1/callback'
      - 'http://localhost/callback'
      - 'https://bananas.sam-mesh.dev/console/auth/callback'
      - 'https://hub.sam-mesh.dev/console/auth/callback'
      - 'https://auth.sam-mesh.dev/device/callback'
      - 'urn:ietf:wg:oauth:2.0:oob'
      - '/device/callback'