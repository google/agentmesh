apiVersion: v1
kind: ServiceAccount
metadata:
  name: agentmesh-router-sa
  namespace: ${NAMESPACE}
---
apiVersion: v1
kind: Service
metadata:
  name: agentmesh-router-${ENV_NAME}
  namespace: ${NAMESPACE}
spec:
  clusterIP: None
  ports:
    - port: 4501
      targetPort: 4501
      protocol: TCP
      name: p2p-tcp
    - port: 4501
      targetPort: 4501
      protocol: UDP
      name: p2p-udp
  selector:
    app: agentmesh-router-${ENV_NAME}
---
apiVersion: v1
kind: Service
metadata:
  name: agentmesh-router-ingress-${ENV_NAME}
  namespace: ${NAMESPACE}
spec:
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: http-ingress
  selector:
    app: agentmesh-router-${ENV_NAME}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: agentmesh-router-${ENV_NAME}
  namespace: ${NAMESPACE}
spec:
  serviceName: "agentmesh-router-${ENV_NAME}"
  replicas: ${ROUTER_REPLICAS}
  # A router that is ready has not been re-handshaken by anyone yet: members
  # redial a dropped router with a backoff that reaches a minute, and older
  # members only on their monitor interval of one minute. A rollout that
  # takes the next router sooner takes every session a member has before
  # any is back. The first rollout under the soak fleet did exactly that in
  # 45 seconds.
  minReadySeconds: 90
  selector:
    matchLabels:
      app: agentmesh-router-${ENV_NAME}
  template:
    metadata:
      labels:
        app: agentmesh-router-${ENV_NAME}
    spec:
      serviceAccountName: agentmesh-router-sa
      securityContext:
        fsGroup: 65532
        fsGroupChangePolicy: "OnRootMismatch"
      containers:
      - name: agentmesh-router
        image: ghcr.io/google/agentmesh-router:${IMAGE_TAG}
        ports:
        - containerPort: 4501
          hostPort: 4501
          protocol: TCP
          name: p2p-tcp
        - containerPort: 4501
          hostPort: 4501
          protocol: UDP
          name: p2p-udp
        # Cluster-internal only: no hostPort, and nothing on it is authenticated.
        - containerPort: 9090
          protocol: TCP
          name: metrics
        # External HTTP ingress reached via the Gateway HTTPRoute (/ingress/*).
        - containerPort: 8080
          protocol: TCP
          name: http-ingress
        args:
        - "--control-plane=http://agentmesh-control-plane-${ENV_NAME}.${NAMESPACE}.svc.cluster.local:8080"
        - "--insecure-control-plane"
        - "--listen=/ip4/0.0.0.0/tcp/4501"
        - "--listen=/ip4/0.0.0.0/udp/4501/quic-v1"
        - "--external-addr=/dnsaddr/bootstrap.${ENV_NAME}.sam-mesh.dev"
        - "--jwt-path=/var/run/secrets/tokens/agentmesh-token"
        - "--keys-path=/data/router.key"
        - "--metrics-addr=0.0.0.0:9090"
        - "--ingress-addr=0.0.0.0:8080"
        - "--ingress-url=https://${ENV_NAME}.sam-mesh.dev/ingress"
        - "--public-control-plane=https://${ENV_NAME}.sam-mesh.dev"
        - "--allow-insecure-ingress-http"
        # Profiles on loopback only: `kubectl port-forward <pod> 6060` then
        # `go tool pprof http://127.0.0.1:6060/debug/pprof/heap`.
        - "--pprof-addr=127.0.0.1:6060"
        - "--high-watermark=${ROUTER_HIGH_WATERMARK}"
        # /healthz answers as soon as the process is up; /readyz once the
        # router has enrolled and its libp2p host is online.
        startupProbe:
          httpGet:
            path: /healthz
            port: metrics
          periodSeconds: 5
          failureThreshold: 24
        readinessProbe:
          httpGet:
            path: /readyz
            port: metrics
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /healthz
            port: metrics
          periodSeconds: 20
        resources:
          requests:
            # A router at its watermark of 6000 members holds about 1 GiB; a
            # request below that is the first pod evicted under pressure.
            cpu: 500m
            memory: 1Gi
        volumeMounts:
        - name: agentmesh-token
          mountPath: /var/run/secrets/tokens
          readOnly: true
        - name: router-data
          mountPath: /data
      volumes:
      - name: agentmesh-token
        projected:
          sources:
          - serviceAccountToken:
              path: agentmesh-token
              expirationSeconds: 3600
              audience: "agentmesh-control-plane-audience"
  volumeClaimTemplates:
  - metadata:
      name: router-data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 1Gi
