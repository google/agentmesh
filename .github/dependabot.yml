version: 2
updates:
  - package-ecosystem: "gomod"
    directories:
      - "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      k8s-deps:
        patterns:
          - "*k8s.io*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7

  # Dev container features, and the digest-pinned base images of the two
  # dev container Dockerfiles.
  - package-ecosystem: "devcontainers"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7

  - package-ecosystem: "docker"
    directories:
      - "/.devcontainer"
      - "/.devcontainer/testnet"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7

  - package-ecosystem: "npm"
    directories:
      - "/tests/ui"
      - "/sdk/js"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7

  - package-ecosystem: "pip"
    directories:
      - "/sdk/python"
      - "/cmd/chaos-agent"
      - "/tests/e2e/docker/*"
      - "/development/examples/*"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      python-deps:
        patterns:
          - "*"

  - package-ecosystem: "pub"
    directory: "/mobile/sam-node-app"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7

  - package-ecosystem: "gradle"
    directory: "/mobile/sam-node-app/android"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7

  - package-ecosystem: "docker"
    directories:
      - "/"
      - "/tests/e2e/docker"
      - "/tests/e2e/docker/*"
      - "/development/examples/*"
      - "/development/examples/code-reviewer-pool/*"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    # A new Python or Node release is a deliberate move, not a digest
    # refresh: the SDK images track what the SDKs' dependencies build on
    # (py-libp2p pins coincurve, which has no wheel for a Python released
    # this year) and Node stays on an LTS line. Digests keep flowing.
    ignore:
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
    groups:
      docker-digests:
        patterns:
          - "*"
