# One pull request per ecosystem per week. Minor and patch updates are
# grouped so a weekly run opens one PR instead of one per dependency.
# A major update stays in its own PR: it needs a human decision and must
# not block the rest of the batch.
version: 2
updates:
  - package-ecosystem: "gomod"
    directories:
      - "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      k8s-deps:
        patterns:
          - "*k8s.io*"
      go-deps:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Dev container features, and the digest-pinned base images of the two
  # dev container Dockerfiles.
  - package-ecosystem: "devcontainers"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      devcontainer-features:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directories:
      - "/.devcontainer"
      - "/.devcontainer/testnet"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      devcontainer-images:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directories:
      - "/tests/ui"
      - "/sdk/js"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      npm-deps:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "pip"
    directories:
      - "/sdk/python"
      - "/cmd/chaos-agent"
      - "/tests/e2e/docker/*"
      - "/development/examples/*"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      python-deps:
        patterns:
          - "*"

  - package-ecosystem: "pub"
    directory: "/mobile/agentmesh-node-app"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      pub-deps:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "gradle"
    directory: "/mobile/agentmesh-node-app/android"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      gradle-deps:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "docker"
    directories:
      - "/"
      - "/tests/e2e/docker"
      - "/tests/e2e/docker/*"
      - "/development/examples/*"
      - "/development/examples/code-reviewer-pool/*"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    # A new Python or Node release is a deliberate move, not a digest
    # refresh: the SDK images track what the SDKs' dependencies build on
    # (py-libp2p pins coincurve, which has no wheel for a Python released
    # this year) and Node stays on an LTS line. Digests keep flowing.
    ignore:
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
    groups:
      docker-digests:
        patterns:
          - "*"
