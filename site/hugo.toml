title = "Agent Mesh"
baseURL = "https://google.github.io/agentmesh/"
languageCode = "en-us"

enableRobotsTXT = true

# Point to the content directory
contentDir = "content"

[markup]
  [markup.highlight]
    codeFences = true
    hl_Lines = ""
    lineNoStart = 1
    lineNos = false
    lineNumbersInTable = true
    noClasses = false # Needed for dark mode theme switching
    style = "vs"
    tabWidth = 4

  [markup.goldmark.renderer]
    unsafe = true

[module]
  [[module.imports]]
    path = "github.com/google/docsy"

# Top navigation. The section _index.md files carry no menu entries of their
# own; everything is listed here so the order is in one place.
[menu]
  [[menu.main]]
    identifier = "docs"
    name = "Docs"
    title = "Documentation"
    url = "/docs/"
    weight = 1

  [[menu.main]]
    identifier = "getting-started"
    name = "Getting started"
    url = "/docs/getting-started/"
    weight = 2

  [[menu.main]]
    identifier = "concepts"
    name = "Concepts"
    url = "/docs/concepts/"
    weight = 3

  [[menu.main]]
    identifier = "guides"
    name = "Guides"
    url = "/docs/guides/"
    weight = 4

  [[menu.main]]
    identifier = "reference"
    name = "Reference"
    url = "/docs/reference/"
    weight = 5

  [[menu.main]]
    identifier = "preview"
    name = "Preview"
    url = "/docs/preview/"
    weight = 6

[params]
  github_repo = "https://github.com/google/agentmesh"
  github_subdir = "site"
  github_branch = "main"
  offlineSearch = true

  [params.ui]
    showLightDarkModeMenu = true
    sidebar_menu_compact = true
    sidebar_menu_foldable = true
    ul_show = 1

  # Logo & branding colors will be customized via project styles
